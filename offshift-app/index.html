:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --cell2:#E9E9EE; --fill:rgba(120,120,128,.12);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.18);
  --blue:#007AFF; --orange:#FF9500; --green:#34C759; --indigo:#5856D6; --teal:#30B0C7; --red:#FF3B30;
  --bar:rgba(249,249,249,.86);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1C1C1E; --cell2:#2C2C2E; --fill:rgba(118,118,128,.24);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --blue:#0A84FF; --orange:#FF9F0A; --green:#30D158; --indigo:#5E5CE6; --teal:#40C8E0; --red:#FF453A;
  --bar:rgba(22,22,24,.86); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --cell2:#2C2C2E; --fill:rgba(118,118,128,.24);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --blue:#0A84FF; --orange:#FF9F0A; --green:#30D158; --indigo:#5E5CE6; --teal:#40C8E0; --red:#FF453A;
  --bar:rgba(22,22,24,.86); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.29 var(--font);letter-spacing:-.022em;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;

button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

.page{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));

.lt .sub{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.01em}
.lt h1{margin:0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.012em}
.lt .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

/* grouped sections */
.sec{display:grid;gap:7px;min-width:0}
.sh{font-size:13px;color:var(--label2);text-transform:uppercase;padding:0 16px;letter-spacing:-.005em}
.sh.big{font-size:22px;font-weight:700;color:var(--label);text-transform:none;padding:0 2px;letter-spacing:.01em}
.sf{font-size:13px;line-height:1.38;color:var(--label2);padding:0 16px}
.grp{background:var(--cell);border-radius:12px;overflow:hidden;min-width:0}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;position:relative;min-width:0}
.cell+.cell::before,.cellwrap+.cellwrap::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.cell.ind+.cell.ind::before{left:52px}
.cell .grow{flex:1;min-width:0}
.cell .trail{color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell .t2{font-size:15px;color:var(--label2)}
.cell.btnrow{justify-content:center;color:var(--blue);cursor:pointer;width:100%}
.cell.btnrow.destructive{color:var(--red)}
.chev{width:8px;height:13px;flex:none;color:var(--label3)}
.ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.ico svg{width:17px;height:17px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 18px;font-weight:600;font-size:17px;cursor:pointer}
.btn.fill{background:var(--blue);color:#fff}
.btn.orange{background:var(--orange);color:#000}
.btn.tint{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.btn.small{padding:7px 14px;font-size:15px;border-radius:20px}
.btn.block{width:100%}

/* rings */
.rings{display:flex;gap:18px;align-items:center;padding:16px}
.rings svg{width:132px;height:132px;flex:none}
.rl{display:grid;gap:10px;min-width:0}
.rl div{display:grid;gap:0}
.rl .k{font-size:15px;font-weight:600}
.rl .v{font:600 22px/1.15 var(--round);font-variant-numeric:tabular-nums;letter-spacing:0}
.rl .v small{font-size:15px;color:var(--label2);font-weight:500}

/* up next */
.next{background:var(--cell);border-radius:16px;padding:16px;display:grid;gap:10px}
.next .tag{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.next .tag i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff}
.next .tag i svg{width:13px;height:13px}
.next h2{margin:0;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.next p{margin:0;color:var(--label2);font-size:15px;line-height:1.35}

/* round checks (Reminders style) */
.chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--label3);flex:none;margin:0;display:grid;place-items:center;cursor:pointer}
.chk:checked{background:var(--orange);border-color:var(--orange)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.vrow .grow{display:grid;gap:1px}
.vrow a{color:var(--label);overflow-wrap:anywhere}
.vrow.done a{color:var(--label2)}
.vrow .code{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}

.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;margin:0;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}

/* inputs inside cells */
.cell input[type=number],.cell input[type=text],.cell input[type=date],.cell select{font:inherit;letter-spacing:inherit;color:var(--label2);background:transparent;border:0;text-align:right;min-width:0;width:120px;padding:0}
.cell select{appearance:none;-webkit-appearance:none;color:var(--blue);width:auto;cursor:pointer}
.cell input:focus{color:var(--label);outline:none}
textarea{font:13px var(--mono);color:var(--label);background:transparent;border:0;width:100%;resize:vertical;padding:0}

/* bars and stats */
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--green)}
.bar.o i{background:var(--orange)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px 16px 4px}
.stat{display:grid;gap:2px;min-width:0}
.stat .k{font-size:13px;color:var(--label2);font-weight:600}
.stat .v{font:700 clamp(19px,5.6vw,28px)/1.1 var(--round);font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap}
.stat .v.o{color:var(--orange)} .stat .v.g{color:var(--green)}
.stat .s{font-size:13px;color:var(--label2)}
.pad{padding:12px 16px 14px;display:grid;gap:10px}

/* calendar */
.month{display:grid;gap:8px}
.mh{font-size:22px;font-weight:700;color:var(--red);padding:0 2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--cell);border-radius:12px;padding:6px 4px 8px}
.dow{font-size:11px;font-weight:600;color:var(--label2);text-align:center;padding:4px 0 6px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;border-top:.5px solid var(--sep);cursor:pointer;min-width:0;border-radius:0;color:var(--label)}
.day.blank{cursor:default}
.day .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}
.day.past .n{color:var(--label3)}
.day.today .n{background:var(--red);color:#fff;font-weight:600}
.day .st{font-size:10px;font-weight:600;color:#fff;background:var(--indigo);border-radius:4px;padding:1px 4px;white-space:nowrap;max-width:100%;overflow:hidden;font-variant-numeric:tabular-nums}
.day.rec .st{background:transparent;color:var(--indigo)}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--label2);padding:0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* details (disclosure groups) */
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details .chev{transition:transform .2s}
details[open]>summary .chev{transform:rotate(90deg)}
.obj{font-size:13px;color:var(--label2);text-transform:uppercase;padding:14px 16px 4px;background:var(--bg)}

/* week plan */
.wk{display:grid;gap:4px}
.wk .h{display:flex;gap:8px;align-items:center}
.wk .h b{font-weight:600}
.badge{font-size:12px;font-weight:600;color:var(--orange);background:color-mix(in srgb,var(--orange) 16%,transparent);border-radius:6px;padding:2px 7px}
.wk dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:2px 0 0;font-size:15px}
.wk dt{color:var(--label2)}
.wk dd{margin:0}

/* chart */
svg text{fill:var(--label2);font:10px var(--font)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);display:flex;justify-content:space-around;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar a{flex:1;max-width:120px;display:grid;justify-items:center;gap:2px;color:var(--label2);font-size:10px;font-weight:500;letter-spacing:.01em;padding-bottom:4px}
.tabbar a svg{width:26px;height:26px}
.tabbar a[aria-current="page"]{color:var(--orange)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* HUD toast */
.hud{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:30;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  color:var(--label);border-radius:14px;padding:14px 20px;font-size:15px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.18);text-align:center;max-width:80vw}
@media (prefers-reduced-motion:no-preference){.ring{transition:stroke-dashoffset .6s ease}.bar i{transition:width .4s ease}}
@media (max-width:380px){.rings svg{width:112px;height:112px}.stat .v{font-size:24px}.day .n{width:26px;height:26px;font-size:15px}}
</style>
</head>

const START=new Date(2026,10,2), END=new Date(2027,0,3);

const isNight=s=>{const t=shiftTime(s);return !!t&&+t.slice(0,2)>=19};

const dayType=s=>{if(isShift(s))return "shift";const p=ds(add(pd(s),-1));return isShift(p)&&isNight(p)?"rec":"off"};
function schedule(){
  if(cache.sch)return cache.sch;
  const map={};const queue=VID.filter(v=>!S.done[v.i]);
  const todayDone=VID.filter(v=>S.done[v.i]===T);
  let d=new Date(TODAY),qi=0,last=null;
  for(let n=0;n<400&&(qi<queue.length||n===0);n++){
    const s=ds(d),b=budget(s);const list=n===0?[...todayDone]:[];let used=list.reduce((a,v)=>a+v.sec,0);
    while(b>0&&qi<queue.length&&used<b){list.push(queue[qi]);used+=queue[qi].sec;qi++}
    if(list.length){map[s]=list;if(list.some(v=>!S.done[v.i]))last=s}
    d=add(d,1);
  }
  cache.sch={map,last};return cache.sch;
}

// ---------- run placement ----------
// Shift days are fully off. "rec" = the day a night shift ends (home ~9am, sleeping): no run, half study.
// Each week picks up to 3 runs on the remaining free days. Intervals matter most, then tempo/test, then easy.
// Two hard sessions are never placed on back-to-back days.
function weekRuns(w){
  if(cache["w"+w])return cache["w"+w];
  const days=[...Array(7)].map((_,i)=>ds(add(START,w*7+i)));
  const free=days.filter(s=>dayType(s)==="off");
  const testWk=w===3||w===8;
  const val={A:10,B:4,C:testWk?12:8};
  const combos=(arr,k,st=0,cur=[])=>k===0?[cur]:arr.slice(st).flatMap((_,j)=>combos(arr,k-1,st+j+1,[...cur,arr[st+j]]));
  const perms=a=>a.length<2?[a]:a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(r=>[x,...r]));
  const kindSets={1:[["A"],["C"]],2:[["A","C"],["A","B"],["C","B"]],3:[["A","B","C"]]};
  let best=null,bs=-1e9;
  for(let k=1;k<=Math.min(3,free.length);k++)for(const c of combos(free,k))for(const ks of kindSets[k])for(const pm of perms(ks)){
    let sc=pm.reduce((a,x)=>a+val[x],0);
    for(let i=1;i<c.length;i++){const g=diff(pd(c[i]),pd(c[i-1]));if(g===1&&pm[i]!=="B"&&pm[i-1]!=="B")sc-=7;if(g>=2)sc+=1}
    if(pm.indexOf("A")>-1&&pm.indexOf("C")>-1&&pm.indexOf("A")>pm.indexOf("C"))sc-=.5;
    if(sc>bs){bs=sc;best=c.map((d,i)=>[d,pm[i]])}
  }
  const out={};(best||[]).forEach(([d,k])=>out[d]=k);
  cache["w"+w]=out;return out;
}
function runOn(s){const w=Math.floor(diff(pd(s),START)/7);if(w<0||w>8)return null;const k=weekRuns(w)[s];return k?{w,k,text:PLAN[w][k],focus:PLAN[w].focus,test:k==="C"&&(w===3||w===8)}:null}
const budget=s=>{const t=dayType(s);return t==="off"?S.mins*60:t==="rec"?Math.round(S.mins/2)*60:0};

  <div class="sf" style="margin-top:-12px">Tap a day to add or remove a shift. Runs and videos move around it automatically.</div>
  <div class="sec"><div class="sh">Backup</div><div class="grp">
    <button class="cell btnrow" data-act="export">Copy Backup</button>
    <div class="cell"><textarea id="imp" rows="2" placeholder="Paste a backup here to restore"></textarea></div>
    <button class="cell btnrow" data-act="import">Restore from Backup</button>
    <button class="cell btnrow destructive" data-act="clearshifts">Clear All Shifts</button>
  </div><div class="sf">Progress is saved on this phone only. Copy a backup into Notes every week or two.</div></div>`;
}

function viewRun(){
  const b=best24(),cur=b??BASE_SEC,pct=Math.max(0,Math.min(100,(BASE_SEC-cur)/(BASE_SEC-GOAL_SEC)*100));
  const w=Math.floor(diff(TODAY,START)/7);
  const wkRows=PLAN.map((p,i)=>{const ws=add(START,i*7);return `<div class="cell"><div class="grow wk"><div class="h"><b>Week ${i+1}</b><span class="t2">${ws.getDate()} ${MON[ws.getMonth()]} · ${p.focus}</span>${i===w?'<span class="badge">This Week</span>':""}</div>
    <dl><dt>Intervals</dt><dd>${esc(p.A)}</dd><dt>Easy</dt><dd>${esc(p.B)}</dd><dt>${i===3||i===8?"Test":"Tempo"}</dt><dd>${esc(p.C)}</dd></dl></div></div>`}).join("");
  const log=[...S.runs].sort((a,b)=>b.d<a.d?-1:1).map(r=>`<div class="cell"><div class="grow"><div>${r.km} km${r.tt?' <span class="badge">2.4 Test</span>':""}</div><div class="t2">${nice(pd(r.d))} · ${fmt(r.sec/r.km)} /km</div></div><span class="trail" style="font:600 20px var(--round);color:var(--label)">${fmt(r.sec)}</span><button class="link" style="color:var(--red);font-size:15px" data-act="delrun" data-k="${esc(r.d+"|"+r.sec+"|"+r.km)}">Delete</button></div>`).join("");
  return `<div class="lt"><div class="sub">IPPT 2.4 km · 2 Nov – 3 Jan</div><h1>2.4 km</h1></div>
  <div class="sec"><div class="grp">
    <div class="stats"><div class="stat"><span class="k">Best</span><span class="v">${b?fmt(b):"–"}</span><span class="s">${b?"logged test":"starting ~13:00"}</span></div>
    <div class="stat"><span class="k">Goal</span><span class="v o">11:00</span><span class="s">4:35 /km</span></div>
    <div class="stat"><span class="k">To Cut</span><span class="v g">${fmt(Math.max(0,cur-GOAL_SEC))}</span><span class="s">${Math.round(pct)}% there</span></div></div>
    <div class="pad"><div class="bar o" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
  </div><div class="sf">Fading after 1.6 km is normal right now. Your pace endurance is the gap, and the intervals train exactly that. The week 4 test should come in near 12:00. If it does, 11:00 in week 9 is realistic.</div></div>
  <div class="sec"><div class="sh">Log a Run</div><div class="grp">
    <div class="cell"><label class="grow" for="rd">Date</label><input id="rd" type="date" value="${T}" style="width:150px"></div>
    <div class="cell"><label class="grow" for="rk">Distance</label><input id="rk" type="number" inputmode="decimal" step="0.1" min="0.4" value="2.4" style="width:60px"><span class="trail">km</span></div>
    <div class="cell"><label class="grow" for="rt">Time</label><input id="rt" type="text" inputmode="numeric" placeholder="12:45" style="width:80px"></div>
    <div class="cell"><label class="grow" for="rtt">Full-effort 2.4 km test</label><input class="sw" id="rtt" type="checkbox"></div>
    <button class="cell btnrow" data-act="logrun" style="font-weight:600">Log Run</button>
  </div><div class="sf">Copy the distance and time from Strava after each run. Logging a run also ticks off that day's session.</div></div>
  ${log?`<div class="sec"><div class="sh">History</div><div class="grp">${log}</div></div>`:""}
  <div class="sec"><div class="sh">The Plan</div><div class="grp">${wkRows}</div>
  <div class="sf">Up to three runs a week, only on free days. Never on a shift day, never the morning a night shift ends, and never two hard sessions back to back. ${WU}</div></div>`;
}

function viewSec(){
  const sch=schedule();const done=VID.filter(v=>S.done[v.i]);const dsec=done.reduce((a,v)=>a+v.sec,0);
  const fin=sch.last?pd(sch.last):null;
  const doms=DOM.map(([k,name,w])=>{const vs=VID.filter(v=>v.dom===k),dn=vs.filter(v=>S.done[v.i]).length;
    let body="",lastObj="";
    for(const v of vs){if(v.obj!==lastObj){body+=`<div class="obj">${v.obj} ${esc(OBJ[v.obj])}</div>`;lastObj=v.obj}body+=vrow(v)}
    const pct=dn/vs.length*100;
    return `<details class="cellwrap" style="position:relative"${dn<vs.length&&dn>0?" open":""}><summary class="cell"><div class="grow" style="display:grid;gap:6px"><div style="display:flex;justify-content:space-between;gap:8px"><span>${k==="0"?"Introduction":k+".0 "+esc(name)}</span><span class="trail">${dn}/${vs.length}</span></div><div class="bar"><i style="width:${pct}%"></i></div>${w?`<span class="t2" style="font-size:13px">${w} of the exam</span>`:""}</div>${IC.chev}</summary>${body}</details>`}).join("");
  return `<div class="lt"><div class="sub">CompTIA SY0-701 · Professor Messer</div><h1>Security+</h1></div>
  <div class="sec"><div class="grp">
    <div class="stats"><div class="stat"><span class="k">Watched</span><span class="v">${done.length}<span style="font-size:17px;color:var(--label2)">/121</span></span></div>
    <div class="stat"><span class="k">Time Left</span><span class="v">${hm(TOTAL_SEC-dsec)}</span></div>
    <div class="stat"><span class="k">Finish</span><span class="v g">${fin?`${fin.getDate()} ${MON[fin.getMonth()]}`:"Done"}</span></div></div>
    <div class="pad"><div class="bar" role="progressbar" aria-valuenow="${done.length}" aria-valuemin="0" aria-valuemax="121"><i style="width:${done.length/121*100}%"></i></div></div>
    <div class="cell"><label class="grow" for="mins">Study per free day</label><select id="mins" data-act="mins">${[20,30,45,60,90].map(m=>`<option value="${m}" ${S.mins===m?"selected":""}>${m} min</option>`).join("")}</select>${IC.chev.replace('class="chev"','class="chev" style="transform:rotate(90deg)"')}</div>
  </div><div class="sf">Shift days have no study target. The day a night shift ends gets half. After the videos, do two weeks of practice exams before you book. Domain 4 is the biggest slice and overlaps your SOC work.</div></div>
  <div class="sec"><div class="sh">Course</div><div class="grp">${doms}</div></div>`;
}

// ---------- Apple Health import (via Shortcuts clipboard text) ----------
// Accepts "OFFSHIFT|2026-11-03|2.41 km|12:51" and looser text like "2.41 km 0:12:51" or "771 s".
function parseRun(txt){
  if(!txt)return null;txt=String(txt).trim();
  const parts=txt.startsWith("OFFSHIFT")?txt.split("|").slice(1):[txt];
  const all=parts.join(" ");
  let d=(all.match(/(\d{4}-\d{2}-\d{2})/)||[])[1];
  if(!d&&parts[0]){const t=Date.parse(parts[0].replace(/ at .*/,""));if(!isNaN(t))d=ds(new Date(t))}
  d=d||T;
  const distTxt=parts.length>=3?parts[1]:all;
  let km=null,m;
  if(m=distTxt.match(/([\d.,]+)\s*km/i))km=parseFloat(m[1].replace(",","."));
  else if(m=distTxt.match(/([\d.,]+)\s*mi\b/i))km=parseFloat(m[1].replace(",","."))*1.609;
  else if(m=distTxt.match(/([\d.,]+)\s*m\b/i))km=parseFloat(m[1].replace(",",""))/1000;
  else if(parts.length>=3&&(m=parts[1].match(/^\s*([\d.]+)\s*$/)))km=parseFloat(m[1]);
  const durTxt=parts.length>=3?parts.slice(2).join(" "):all.replace(/\d{4}-\d{2}-\d{2}/,"");
  let sec=null;
  if(m=durTxt.match(/(\d{1,2}):(\d{2}):(\d{2})/))sec=+m[1]*3600+ +m[2]*60+ +m[3];
  else if(m=durTxt.match(/(\d{1,3}):(\d{2})(?!\d)/))sec=+m[1]*60+ +m[2];
  else if(/min|hr|sec|\bs\b/i.test(durTxt)){const h=durTxt.match(/(\d+)\s*h/i),mi=durTxt.match(/(\d+)\s*min/i),se=durTxt.match(/(\d+)\s*s(ec)?\b/i);
    sec=(h?+h[1]*3600:0)+(mi?+mi[1]*60:0)+(se?+se[1]:0)||null}
  else if(m=durTxt.match(/^\s*([\d.]+)\s*$/))sec=Math.round(parseFloat(m[1]));
  if(!(km>0)||!(sec>0))return null;
  return {d,km:Math.round(km*100)/100,sec};
}
function fillRun(txt){
  const r=parseRun(txt);
  if(!r){toast("Couldn't read a run from that. Run the shortcut again?");return false}
  document.getElementById("rd").value=r.d;document.getElementById("rk").value=r.km;
  const mm=Math.floor(r.sec/60),ss=r.sec%60;document.getElementById("rt").value=mm+":"+pad(ss);
  const pr=runOn(r.d);document.getElementById("rtt").checked=!!(pr&&pr.test&&Math.abs(r.km-2.4)<=0.15);
  document.getElementById("pastebox").hidden=true;
  toast("Filled in. Check it, then Log Run");return true;
}
document.addEventListener("input",e=>{if(e.target.id==="pastein"&&e.target.value.trim())fillRun(e.target.value)});

// ---------- render + events ----------
const VIEWS={today:viewToday,plan:viewPlan,run:viewRun,secplus:viewSec};
function route(){const h=location.hash.slice(1);return VIEWS[h]?h:"today"}
function render(){
  const r=route();
  document.getElementById("app").innerHTML=VIEWS[r]();
  document.querySelectorAll(".tabbar a").forEach(a=>a.getAttribute("href")==="#"+r?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
}
function changed(msg){cache={};save();const y=scrollY;render();scrollTo(0,y);if(msg)toast(msg)}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1400)}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
  if(a==="shift"){const d=el.dataset.d;if(S.shifts[d])delete S.shifts[d];else S.shifts[d]="Shift";changed()}
  else if(a==="clearshifts"){if(el.dataset.sure){S.shifts={};changed("Shifts Cleared")}else{el.dataset.sure=1;el.textContent="Tap Again to Clear All Shifts"}}
  else if(a==="export"){const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Backup Copied"),()=>{const ta=document.getElementById("imp");ta.value=t;ta.select();toast("Select the text and copy it")})}
  else if(a==="import"){try{const o=JSON.parse(document.getElementById("imp").value);if(!o||typeof o.shifts!=="object")throw 0;S=Object.assign({},DEF,o);changed("Restored")}catch(err){toast("That doesn't look like a backup")}}
  else if(a==="health"){
    const fallback=()=>{const b=document.getElementById("pastebox");b.hidden=false;const t=document.getElementById("pastein");t.value="";t.focus()};
    if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(t=>{if(!fillRun(t))fallback()},fallback);else fallback()}
  else if(a==="rundone"){S.runDone[T]=true;changed("Nice Work")}
  else if(a==="scr"){const v=parseFloat(document.getElementById("scr").value);if(isNaN(v)||v<0||v>24){toast("Enter hours between 0 and 24");return}S.screen[el.dataset.d]=v;changed("Saved")}
  else if(a==="logrun"){
    const d=document.getElementById("rd").value,km=parseFloat(document.getElementById("rk").value),t=document.getElementById("rt").value.trim();
    const m=t.match(/^(\d{1,2})[:.](\d{2})$/);
    if(!d||!(km>0)||!m){toast("Enter a time like 12:45");return}
    const sec=+m[1]*60+ +m[2],isT=document.getElementById("rtt").checked,prev=best24();
    if(S.runs.some(r=>r.d===d&&r.sec===sec&&r.km===km)){toast("That run is already logged");return}
    S.runs.push({d,km,sec,tt:isT});S.runDone[d]=true;
    changed(isT&&(prev==null||sec<prev)?"New Best 2.4":"Run Logged")}
  else if(a==="delrun"){const k=el.dataset.k;const i=S.runs.findIndex(r=>r.d+"|"+r.sec+"|"+r.km===k);if(i>-1){S.runs.splice(i,1);changed("Deleted")}}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.act==="vid"){const i=el.dataset.i;if(el.checked)S.done[i]=T;else delete S.done[i];changed(el.checked?"Watched":null)}
  else if(el.dataset.act==="mins"){S.mins=+el.value;changed("Plan Updated")}
});
window.addEventListener("hashchange",()=>{render();scrollTo(0,0)});
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;const n=new Date();n.setHours(0,0,0,0);if(ds(n)!==T){TODAY=n;T=ds(n);cache={};render()}});
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
