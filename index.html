<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rhythm</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="app-version" content="2.8.4">
<meta name="apple-mobile-web-app-title" content="Rhythm">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var _t=(JSON.parse(localStorage.getItem("offshift-v1")||"{}")||{}).theme;if(_t==="light"||_t==="dark")document.documentElement.setAttribute("data-theme",_t);if((JSON.parse(localStorage.getItem("offshift-v1")||"{}")||{}).splash===false||sessionStorage.getItem("rhythm-ptr")||sessionStorage.getItem("rhythm-nosplash"))document.documentElement.classList.add("nosplash")}catch(e){}</script>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* Layout: iOS inset-grouped lists under a large title, fixed translucent tab bar at the bottom. Colors are Apple's system palette. */
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --cell2:#E9E9EE; --fill:rgba(120,120,128,.12);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.18);
  --blue:#007AFF; --orange:#FF9500; --green:#34C759; --indigo:#5856D6; --teal:#30B0C7; --red:#FF3B30;
  --bar:rgba(249,249,249,.86);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1C1C1E; --cell2:#2C2C2E; --fill:rgba(118,118,128,.24);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --blue:#0A84FF; --orange:#FF9F0A; --green:#30D158; --indigo:#5E5CE6; --teal:#40C8E0; --red:#FF453A;
  --bar:rgba(22,22,24,.86); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --cell2:#2C2C2E; --fill:rgba(118,118,128,.24);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --blue:#0A84FF; --orange:#FF9F0A; --green:#30D158; --indigo:#5E5CE6; --teal:#40C8E0; --red:#FF453A;
  --bar:rgba(22,22,24,.86); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.29 var(--font);letter-spacing:-.022em;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px)}
a{color:var(--blue);text-decoration:none}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.page{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:22px}

/* large title */
.lt{display:grid;gap:2px;padding-top:6px}
.lt .sub{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.01em}
.lt h1{margin:0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.012em}
.lt .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

.greet{font-size:22px;font-weight:700;letter-spacing:.01em;padding-top:10px;margin-bottom:-14px;
  background:linear-gradient(90deg,var(--indigo),#FF375F 55%,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.daynav{display:flex;gap:6px;align-items:center;padding-bottom:4px}
.navb{width:34px;height:34px;border-radius:50%;background:var(--fill);color:var(--blue);font-size:24px;line-height:1;display:grid;place-items:center;padding-bottom:3px}
.cal.editing{outline:2px solid var(--blue);outline-offset:2px}
.acc+.acc{border-top:.5px solid var(--sep)}
.acch{width:100%;text-align:left;cursor:pointer}
.acch .chev{transition:transform .3s cubic-bezier(.3,.7,.2,1)}
.acc.open .acch .chev{transform:rotate(90deg)}
.accb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.3,.7,.2,1)}
.acc.open .accb{grid-template-rows:1fr}
.accin{overflow:hidden;min-height:0;background:var(--bg)}
.accin .vrow{background:var(--cell);opacity:0;transform:translateY(-6px);transition:opacity .25s ease,transform .3s ease}
.acc.open .accin .vrow{opacity:1;transform:none;transition-delay:.08s}
.vrow .num{width:24px;flex:none;text-align:right;font-size:13px;color:var(--label3);font-variant-numeric:tabular-nums;margin-right:-4px}
.accin .vrow+.vrow::before{left:88px}
@media (prefers-reduced-motion:reduce){.accb,.accin .vrow,.acch .chev{transition:none}}
.vrow.nextv,.accin .vrow.nextv{background:color-mix(in srgb,var(--blue) 14%,var(--cell))}
/* startup: a white heartbeat line draws across a black screen, then the app fades in */
#splash{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-content:center;
  padding:env(safe-area-inset-top,0px) 24px env(safe-area-inset-bottom,0px);transition:opacity .45s ease;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
.nosplash #splash{display:none}
#splash .stage{width:min(78vw,340px)}
#splash .beat{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 5px rgba(255,255,255,.35))}
#splash .beatline{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.15s cubic-bezier(.45,.05,.35,1) forwards .15s}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){#splash .beatline{animation:none;stroke-dashoffset:0}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{border-radius:7px;padding:7px 0;font-size:13px;font-weight:600;color:var(--label);transition:background .2s,box-shadow .2s}
.seg button[aria-checked="true"]{background:var(--cell);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-checked="true"]{background:#636366}}
:root[data-theme="dark"] .seg button[aria-checked="true"]{background:#636366}
.backlink{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-size:17px;margin:2px 0 2px -4px;width:fit-content}
.chev.back{transform:rotate(180deg);color:var(--blue);width:10px;height:16px}
/* grouped sections */
.sec{display:grid;gap:7px;min-width:0}
.sh{font-size:13px;color:var(--label2);text-transform:uppercase;padding:0 16px;letter-spacing:-.005em}
.sh.big{font-size:22px;font-weight:700;color:var(--label);text-transform:none;padding:0 2px;letter-spacing:.01em}
.sf{font-size:13px;line-height:1.38;color:var(--label2);padding:0 16px}
.grp{background:var(--cell);border-radius:12px;overflow:hidden;min-width:0}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;position:relative;min-width:0}
.cell+.cell::before,.cellwrap+.cellwrap::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.cell.ind+.cell.ind::before{left:52px}
.cell .grow{flex:1;min-width:0}
.cell .trail{color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell .t2{font-size:15px;color:var(--label2)}
.cell.btnrow{justify-content:center;color:var(--blue);cursor:pointer;width:100%}
.cell.btnrow.destructive{color:var(--red)}
.chev{width:8px;height:13px;flex:none;color:var(--label3)}
.ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.ico svg{width:17px;height:17px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 18px;font-weight:600;font-size:17px;cursor:pointer}
.btn.fill{background:var(--blue);color:#fff}
.btn.orange{background:var(--orange);color:#000}
.btn.tint{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.btn.small{padding:7px 14px;font-size:15px;border-radius:20px}
.btn.block{width:100%}
/* pull to refresh: iOS-style spinner that fills in as you pull, then spins */
html,body{overscroll-behavior-y:none}
/* Feels like an app: no text selection or copy pop-up when you press and hold. Typing in boxes still works. */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
a,img{-webkit-user-drag:none}
html{touch-action:manipulation} /* no double-tap zoom */
.ptr{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);margin:0 auto;width:28px;height:28px;z-index:15;pointer-events:none;opacity:0;color:var(--label2)}
.ptr rect{fill:currentColor;opacity:0;transition:opacity .08s}
.ptr.spin svg{animation:ptrspin .9s steps(12) infinite}
.ptr.spin rect{opacity:1}
.ptr.spin rect:nth-child(1){opacity:1}.ptr.spin rect:nth-child(2){opacity:.92}.ptr.spin rect:nth-child(3){opacity:.84}.ptr.spin rect:nth-child(4){opacity:.76}
.ptr.spin rect:nth-child(5){opacity:.68}.ptr.spin rect:nth-child(6){opacity:.6}.ptr.spin rect:nth-child(7){opacity:.52}.ptr.spin rect:nth-child(8){opacity:.44}
.ptr.spin rect:nth-child(9){opacity:.36}.ptr.spin rect:nth-child(10){opacity:.3}.ptr.spin rect:nth-child(11){opacity:.24}.ptr.spin rect:nth-child(12){opacity:.18}
@keyframes ptrspin{to{transform:rotate(-360deg)}}
@media (min-width:1100px) and (min-height:600px){.ptr{left:248px}}
/* Goodnotes reader */
.reader{position:fixed;inset:0;z-index:125;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,1,.3,1)}
.reader.on{transform:none}
body.reading{overflow:hidden}
.rd-bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);z-index:2}
.rd-done{color:var(--blue);font-weight:600;font-size:17px;min-width:64px;text-align:left}
.rd-sp{min-width:64px}
.rd-t{flex:1;display:grid;text-align:center;min-width:0;line-height:1.25}
.rd-t b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-t span{font-size:12px;color:var(--label2);font-variant-numeric:tabular-nums}
.rd-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain}
.rd-pages{margin:0 auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start;will-change:transform}
.rd-pg{background:#fff;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.18);overflow:hidden}
.rd-pg canvas{display:block;width:100%;height:100%}
.rd-load{position:absolute;inset:0;top:60px;display:grid;place-content:center;justify-items:center;gap:12px;color:var(--label2);font-size:15px;text-align:center;padding:0 32px;pointer-events:none}
.rd-spin{animation:ptrspin .9s steps(12) infinite;fill:currentColor}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepn{flex:none;width:22px;height:22px;border-radius:11px;background:var(--fill);color:var(--label2);font:600 13px/22px var(--font);text-align:center;margin-top:1px}
/* week view */
.wk-row{width:100%;gap:12px;align-items:center}
.wk-row.past{opacity:.6}
.wk-d{display:grid;justify-items:center;width:40px;flex:none;line-height:1.1}
.wk-d b{font-size:12px;font-weight:600;color:var(--label2);text-transform:uppercase}
.wk-n{font:600 20px/30px var(--round);width:30px;height:30px;border-radius:15px;text-align:center;color:var(--label)}
.wk-row.today .wk-n{background:var(--red);color:#fff}
.wk-c{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;text-align:left;min-width:0}
.wk-b{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--label)}
.wk-b i{width:8px;height:8px;border-radius:50%;flex:none}
.wk-b.muted{color:var(--label2)}
.wk-c .ws-tag{font-size:11px;font-weight:600;color:#fff;background:var(--indigo);border-radius:5px;padding:2px 6px;white-space:nowrap}
.wk-c .ws-tag.hollow{background:transparent;color:var(--indigo);box-shadow:0 0 0 1.2px var(--indigo) inset}
.wk-c .ws-tag.grey{background:var(--label3)}
/* two-finger hold: a Dynamic Island-style capsule with a ring that fills */
.seg.seg4{grid-template-columns:repeat(4,1fr)}
.hpad{position:relative;height:150px;border-radius:12px;background:var(--fill);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.hpad-t{font-size:15px;color:var(--label2);transition:opacity .2s}
.hpad.busy .hpad-t{opacity:0}
.hpad .pad-hold{position:absolute;top:50%;left:50%;right:auto;margin:0;translate:-50% -50%;pointer-events:none}
.hold{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:121;display:flex;align-items:center;gap:10px;
  background:#000;color:#fff;border-radius:22px;padding:9px 16px 9px 10px;box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 0 .5px rgba(255,255,255,.14) inset;
  transform:scale(.7) translateY(-8px);opacity:0;transition:transform .3s cubic-bezier(.2,1.35,.35,1),opacity .2s}
.hold.on{transform:none;opacity:1}
.hold.out{transform:scale(.85) translateY(-6px);opacity:0}
.hold .hold-t{font:600 15px var(--font)}
.hold .hr-bg{fill:none;stroke:rgba(48,209,88,.25);stroke-width:2.6}
.hold .hr-fg{fill:none;stroke:#30D158;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:56.55;stroke-dashoffset:56.55}
.hold .hr-ck{fill:none;stroke:#30D158;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset .25s .05s}
.hold.done .hr-ck{stroke-dashoffset:0}
@media (min-width:1100px) and (min-height:600px){.hold{left:248px}}
@media (prefers-reduced-motion:reduce){.hold{transition:opacity .2s}}
/* swipe a row for its action */
[data-swipe]{position:relative;touch-action:pan-y}
.swact{position:absolute;top:0;bottom:0;left:100%;width:100vw;display:flex;align-items:center;padding-left:20px;color:#fff;font:600 15px var(--font);border:0;border-radius:0;transition:padding-left .25s cubic-bezier(.2,1,.3,1)}
.swact span{display:inline-block;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.swact.full{padding-left:28px}
.swact.full span{transform:scale(1.08)}
.swact.fire span{transform:scale(1.15)}
[data-swipe].swgone{transition:height .25s ease,opacity .2s ease!important;overflow:hidden}
.grp{overflow:hidden}
/* long-press a roster day */
.cal .day{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .15s}
.cal .day.pressed{transform:scale(.92)}
/* demo banner */
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--label);
  border-radius:12px;padding:10px 12px 10px 14px;font-size:15px;margin-top:6px}
.demo-bar b{color:var(--blue)}
.demo-bar button{background:var(--blue);color:#fff;font-weight:600;font-size:15px;border-radius:16px;padding:6px 14px;flex:none}
/* first-open login screen */
.months{display:grid;gap:22px}
.cols>.col,.cols .stack{display:grid;gap:22px;align-content:start;min-width:0}
body.gate .tabbar{display:none}
.gate-top{display:grid;justify-items:center;gap:8px;text-align:center;padding:12vh 16px 8px}
.gate-top h1{font-size:30px;margin:6px 0 0}
.gate-top .t2{font-size:15px;color:var(--label2);max-width:300px}
.gate-alt{display:grid;justify-items:center;gap:14px;font-size:15px}
.gate-alt a,.gate-alt button{color:var(--blue);background:none;border:0;font:inherit;cursor:pointer;text-decoration:none}
.gate-alt button{color:var(--label2)}

/* rings */
.rings{display:flex;gap:18px;align-items:center;padding:16px}
.rings svg{width:132px;height:132px;flex:none}
.rl{display:grid;gap:10px;min-width:0}
.rl div{display:grid;gap:0}
.rl .k{font-size:15px;font-weight:600}
.rl .v{font:600 22px/1.15 var(--round);font-variant-numeric:tabular-nums;letter-spacing:0}
.rl .v small{font-size:15px;color:var(--label2);font-weight:500}

/* up next */
.next{background:var(--cell);border-radius:16px;padding:16px;display:grid;gap:10px}
.next .tag{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.next .tag i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff}
.next .tag i svg{width:13px;height:13px}
.next h2{margin:0;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.next p{margin:0;color:var(--label2);font-size:15px;line-height:1.35}

/* round checks (Reminders style) */
.chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--label3);flex:none;margin:0;display:grid;place-items:center;cursor:pointer}
.chk:checked{background:var(--orange);border-color:var(--orange)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.vrow .grow{display:grid;gap:1px}
.vrow a{color:var(--label);overflow-wrap:anywhere}
.vrow.done a{color:var(--label2)}
.vrow .code{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}

/* switch */
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;margin:0;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}

/* inputs inside cells */
.cell input[type=number],.cell input[type=text],.cell input[type=password],.cell input[type=date],.cell input[type=time],.cell select{font:inherit;letter-spacing:inherit;color:var(--label2);background:transparent;border:0;text-align:right;min-width:0;width:120px;padding:0}
.cell select{appearance:none;-webkit-appearance:none;color:var(--blue);width:auto;cursor:pointer}
.cell input:focus{color:var(--label);outline:none}
#voice{font:17px/1.3 var(--font)!important;letter-spacing:-.022em}
#voiceout:empty{display:none}
.t2.ok{color:var(--green)}
textarea{font:13px var(--mono);color:var(--label);background:transparent;border:0;width:100%;resize:vertical;padding:0}

/* bars and stats */
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--green)}
.bar.o i{background:var(--orange)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px 16px 4px}
.stat{display:grid;gap:2px;min-width:0}
.stat .k{font-size:13px;color:var(--label2);font-weight:600}
.stat .v{font:700 clamp(19px,5.6vw,28px)/1.1 var(--round);font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap}
.stat .v.o{color:var(--orange)} .stat .v.g{color:var(--green)}
.stat .s{font-size:13px;color:var(--label2)}
.pad{padding:12px 16px 14px;display:grid;gap:10px}

/* calendar */
.month{display:grid;gap:8px}
.mh{font-size:22px;font-weight:700;color:var(--red);padding:0 2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--cell);border-radius:12px;padding:6px 4px 8px}
.dow{font-size:11px;font-weight:600;color:var(--label2);text-align:center;padding:4px 0 6px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;border-top:.5px solid var(--sep);cursor:pointer;min-width:0;border-radius:0;color:var(--label)}
.day.blank{cursor:default}

// ---------- run placement ----------
// Shift days are fully off. "rec" = the day a night shift ends (home ~9am, sleeping): no run, half study.
// Each week picks up to 3 runs on the remaining free days. Intervals matter most, then tempo/test, then easy.
// Two hard sessions are never placed on back-to-back days.
// The week's plan around your shifts and skipped days (skipping re-plans the week, as before). It doesn't
// depend on today's date, so a planned run stays on its day even after the day has passed.
function basePlan(w){
  if(cache["b"+w])return cache["b"+w];
  const days=[...Array(7)].map((_,i)=>ds(add(START,w*7+i)));
  const free=days.filter(s=>dayType(s)==="off"&&!skipRun(s));
  const testWk=isTestWk(w);
  const val={A:10,B:4,C:testWk?12:8};
  const combos=(arr,k,st=0,cur=[])=>k===0?[cur]:arr.slice(st).flatMap((_,j)=>combos(arr,k-1,st+j+1,[...cur,arr[st+j]]));
  const perms=a=>a.length<2?[a]:a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(r=>[x,...r]));
  const kindSets={1:[["A"],["C"]],2:[["A","C"],["A","B"],["C","B"]],3:[["A","B","C"]]};
  let best=null,bs=-1e9;
  for(let k=1;k<=Math.min(3,free.length);k++)for(const c of combos(free,k))for(const ks of kindSets[k])for(const pm of perms(ks)){
    let sc=pm.reduce((a,x)=>a+val[x],0);
    for(let i=1;i<c.length;i++){const g=diff(pd(c[i]),pd(c[i-1]));if(g===1&&pm[i]!=="B"&&pm[i-1]!=="B")sc-=7;if(g>=2)sc+=1}
    if(pm.indexOf("A")>-1&&pm.indexOf("C")>-1&&pm.indexOf("A")>pm.indexOf("C"))sc-=.5;
    if(sc>bs){bs=sc;best=c.map((d,i)=>[d,pm[i]])}
  }
  const out={};(best||[]).forEach(([d,k])=>out[d]=k);
  cache["b"+w]=out;return out;
}
// The week as it stands: done runs stay put; a run that was skipped, or that's in the past and wasn't marked done,
// moves to the next free day this week. A missed run still shows on its own day (so you can see what was planned
// and still tick it later); ticking it removes the moved copy. Never two hard sessions back to back.
function weekRuns(w){
  if(cache["w"+w])return cache["w"+w];
  const base=basePlan(w),out={},missed={},moved={},need=[];
  for(const [d,k] of Object.entries(base)){
    if(S.runDone[d]){out[d]=k;continue}
    if(skipRun(d)){need.push({k,from:d});continue}
    if(d<T){missed[d]={k,to:null};need.push({k,from:d,miss:true});continue}
    out[d]=k;
  }
  const hard=k=>k!=="B",days=[...Array(7)].map((_,i)=>ds(add(START,w*7+i)));
  const pri={C:isTestWk(w)?0:2,A:1,B:3};need.sort((a,b)=>pri[a.k]-pri[b.k]);
  const clash=(s,k)=>hard(k)&&[-1,1].some(n=>{const x=out[ds(add(pd(s),n))];return x&&hard(x)});
  for(const n of need){
    const slots=days.filter(s=>s>=T&&dayType(s)==="off"&&!skipRun(s)&&!out[s]);
    let s=slots.find(x=>!clash(x,n.k));
    // No room: a more important session (test, then intervals, then tempo, then easy) takes the place of a
    // less important one later this week that isn't done yet. The less important one is dropped.
    if(!s)s=days.filter(x=>x>=T&&out[x]&&!S.runDone[x]&&!moved[x]&&pri[out[x]]>pri[n.k]&&!clash(x,n.k)).sort((x,y)=>pri[out[y]]-pri[out[x]])[0];
    if(!s)continue;

function runOn(s){const w=Math.floor(diff(pd(s),START)/7);if(w<0||w>8)return null;const k=weekRuns(w)[s];

  if(k)return Object.assign(r(k),{from:cache["mv"+w][s]||null});

  </div>`;
  return wide()?head+cols(upnext+cando+runSec,rings+recap+secSec)+weekStrip(dd):head+upnext+cando+rings+recap+runSec+secSec;

// iPad/desktop: the whole week at a glance under Today. Tap a day to open it.
function weekStrip(dd,big){

    const vids=past?VID.filter(v=>S.done[v.i]===d):(sch.map[d]||[]);

    const run=r?`<div class="ws-l${S.runDone[d]||r.missed?" done":""}"><i style="background:var(--orange)${r.missed?";opacity:.45":""}"></i>${r.test?C.testShort:KIND[r.k]}${S.runDone[d]==="part"?" · part":S.runDone[d]?" ✓":r.missed?" · missed":""}</div>`:"";
    const study=vids.length?`<div class="ws-l${vDone===vids.length?" done":""}"><i style="background:var(--green)"></i>${past||vDone===vids.length?`${vids.length} video${vids.length>1?"s":""} ✓`:vDone?`${vDone}/${vids.length} done`:hm(vSec)}</div>`:"";

    return `<button class="ws-day${d===T?" today":""}${d===(DAYSEL||T)&&route()==="day"?" sel":""}${past?" past":""}" data-act="go" data-d="${d}" aria-label="${nice(x)}">
      <div class="ws-h"><span class="ws-dow">${DOW[x.getDay()]}</span><span class="ws-n">${x.getDate()}</span></div>${top}${run}${study}${none}</button>`}).join("");

function screenChart(){

  const W=600,H=150,pl=24,pb=18,max=12,x=i=>pl+i*(W-pl)/14+6,bw=(W-pl)/14-12,y=h=>H-pb-(h/max)*(H-pb-6);

  const b=days.map((d,i)=>{const v=S.screen[d];if(v==null)return"";const ok=v<=screenTarget(d);return `<rect x="${x(i)}" y="${y(v)}" width="${bw}" height="${Math.max(2,H-pb-y(v))}" fill="${ok?"var(--teal)":"var(--orange)"}" rx="4"><title>${d}: ${v}h</title></rect>`}).join("");

// ---------- 2.4 km progress charts ----------
// Test chart: logged 2.4 tests against the target path (13:00 on 2 Nov down to 11:00 on 3 Jan). Faster is higher.
function testChart(){
  const tests=S.runs.filter(r=>r.tt).sort((a,b)=>a.d<b.d?-1:1);
  const W=340,H=190,L=40,R=12,Tp=14,B=26,span=diff(END,START);
  const xs=d=>L+Math.max(0,Math.min(1,diff(pd(d),START)/span))*(W-L-R);
  const lo=Math.min(goalSec()-30,...tests.map(t=>t.sec)),hi=Math.max(baseSec()+30,...tests.map(t=>t.sec));
  const ys=sec=>Tp+(sec-lo)/(hi-lo)*(H-Tp-B);
  const ticks=[];for(let t=Math.ceil(lo/60)*60;t<=hi;t+=60)ticks.push(t);
  let g=ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${ys(t)}" y2="${ys(t)}" stroke="var(--sep)"/><text x="${L-6}" y="${ys(t)+3.5}" text-anchor="end">${fmt(t)}</text>`).join("");
  g+=`<line x1="${L}" x2="${W-R}" y1="${ys(goalSec())}" y2="${ys(goalSec())}" stroke="var(--green)" stroke-width="1.2"/><text x="${W-R}" y="${ys(goalSec())-5}" text-anchor="end" style="fill:var(--green);font-weight:600">Goal ${fmt(goalSec())}</text>`;
  const target=`<line x1="${xs(ds(START))}" y1="${ys(baseSec())}" x2="${xs(ds(END))}" y2="${ys(goalSec())}" stroke="var(--label2)" stroke-dasharray="4 4" stroke-width="1.2"/>`;
  const months=[[2026,10,1],[2026,11,1],[2027,0,1]].map(([y,m,d])=>{const dd=new Date(y,m,d);if(dd<START)dd.setTime(START.getTime());return `<text x="${xs(ds(dd))}" y="${H-8}" text-anchor="${m===10?"start":"middle"}">${MON[m]}</text>`}).join("");
  const today=TODAY>=START&&TODAY<=END?`<line x1="${xs(T)}" x2="${xs(T)}" y1="${Tp}" y2="${H-B}" stroke="var(--blue)" stroke-opacity=".5" stroke-dasharray="2 3"/>`:"";
  const line=tests.length>1?`<polyline points="${tests.map(t=>`${xs(t.d)},${ys(t.sec)}`).join(" ")}" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:"";
  const dots=tests.map((t,i)=>`<circle cx="${xs(t.d)}" cy="${ys(t.sec)}" r="${i===tests.length-1?5:3.5}" fill="var(--orange)" stroke="var(--cell)" stroke-width="2"><title>${nice(pd(t.d))}: ${fmt(t.sec)}</title></circle>`).join("");
  const last=tests[tests.length-1];
  const lbl=last?`<text x="${Math.min(xs(last.d)+8,W-R-30)}" y="${ys(last.sec)-9}" style="fill:var(--label);font-weight:700;font-size:12px">${fmt(last.sec)}</text>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="2.4 km test times against the target path">${g}${target}${today}${months}${line}${dots}${lbl}</svg>`;
}
// Pace chart: every logged run's pace per km, oldest to newest. Faster is higher.
function paceChart(){
  const runs=[...S.runs].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).slice(-14);
  if(!runs.length)return "";
  const W=340,H=150,L=40,R=12,Tp=14,B=22;
  const paces=runs.map(r=>paceOf(r.sec,r.km)),goalP=paceOf(goalSec(),C.dist);
  const lo=Math.min(goalP-10,...paces),hi=Math.max(goalP+60,...paces)+30;
  const n=runs.length,bw=Math.min(18,(W-L-R)/n-6),xs=i=>L+((i+.5)/n)*(W-L-R),ys=p=>Tp+(p-lo)/(hi-lo)*(H-Tp-B);
  const ticks=[];for(let t=Math.ceil(lo/30)*30;t<=hi;t+=30)ticks.push(t);
  let g=ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${ys(t)}" y2="${ys(t)}" stroke="var(--sep)"/><text x="${L-6}" y="${ys(t)+3.5}" text-anchor="end">${fmt(t)}</text>`).join("");
  g+=`<line x1="${L}" x2="${W-R}" y1="${ys(goalP)}" y2="${ys(goalP)}" stroke="var(--green)" stroke-width="1.2"/><text x="${W-R}" y="${ys(goalP)-5}" text-anchor="end" style="fill:var(--green);font-weight:600">Goal pace ${fmt(paceOf(goalSec(),C.dist))}</text>`;
  const bars=runs.map((r,i)=>{const p=paces[i];return `<rect x="${xs(i)-bw/2}" y="${ys(p)}" width="${bw}" height="${Math.max(3,H-B-ys(p))}" rx="4" fill="${r.tt?"var(--orange)":"var(--teal)"}"><title>${nice(pd(r.d))}: ${distTxt(r.km)}, ${fmt(p)}${C.paceU}</title></rect>`}).join("");
  const lab=runs.map((r,i)=>(n<=7||(n-1-i)%2===0)?`<text x="${xs(i)}" y="${H-6}" text-anchor="middle">${pd(r.d).getDate()}/${pd(r.d).getMonth()+1}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Pace per km for recent runs">${g}${bars}${lab}</svg>`;
}

// ---------- Spoken run entry (iPhone keyboard dictation) ----------
// Reads things like "2.4 in 12 minutes 45", "ran 3k this morning, 18:20", "2.4 test yesterday 12:31".
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50};
function wordsToDigits(t){
  // "twenty five" -> 25, "two point four" -> 2.4, "a half" kept as is
  t=t.replace(/\b(twenty|thirty|forty|fifty)[\s-](one|two|three|four|five|six|seven|eight|nine)\b/g,(m,a,b)=>String(NUMW[a]+NUMW[b]));
  t=t.replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty)\b/g,m=>String(NUMW[m]));
  t=t.replace(/(\d+)\s*point\s*(\d+)/g,"$1.$2");
  return t;
}
function parseSpoken(raw){
  if(!raw||!raw.trim())return null;
  let t=wordsToDigits(" "+raw.toLowerCase().replace(/[,!?]/g," ")+" ");
  const out={tt:/\b(test|time trial|trial|ippt|all[- ]out)\b/.test(t)};
  // date
  let d=new Date(TODAY);
  if(/\byesterday\b|\blast night\b/.test(t))d=add(TODAY,-1);
  else{const m=t.match(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/);
    if(m){const want=LONGDOW.map(x=>x.toLowerCase()).indexOf(m[1]);let back=(TODAY.getDay()-want+7)%7;d=add(TODAY,-back)}}
  out.d=ds(d);
  // distance
  let km=null,m;
  if(m=t.match(/(\d+(?:\.\d+)?)\s*(?:km|kms|k|kilomet(?:er|re)s?|kay)\b/)){km=parseFloat(m[1]);t=t.replace(m[0]," ")}
  else if(m=t.match(/(\d{3,5})\s*(?:m|meters|metres)\b/)){km=parseInt(m[1])/1000;t=t.replace(m[0]," ")}
  else if(m=t.match(/(?:^|\s)(\d{1,2}\.\d{1,2})(?=\s)/)){const v=parseFloat(m[1]);if(v>0&&v<=21){km=v;t=t.replace(m[1]," ")}}
  // time
  let sec=null;
  if(m=t.match(/(\d{1,2}):(\d{2}):(\d{2})/))sec=+m[1]*3600+ +m[2]*60+ +m[3];
  else if(m=t.match(/(\d{1,3})[:.](\d{2})(?!\d)/))sec=+m[1]*60+ +m[2];
  else if(m=t.match(/(\d{1,3})\s*(?:minutes?|mins?|m)\b(?:\s*(?:and\s*)?(\d{1,2})\s*(?:seconds?|secs?|s)?\b)?/))sec=+m[1]*60+(m[2]?+m[2]:0);
  else if(m=t.match(/(\d{1,4})\s*(?:seconds?|secs?)\b/))sec=+m[1];
  else{const nums=(t.match(/\b\d{1,2}\b/g)||[]).map(Number);if(nums.length>=2&&nums[1]<60)sec=nums[0]*60+nums[1]}
  // a bare "2.4" with a time but no unit is the IPPT distance
  if(km==null&&sec&&/\b2\.4\b/.test(raw))km=2.4;
  out.km=km?Math.round(km*100)/100:null;out.sec=sec;
  return out;
}
function applySpoken(txt){
  const box=document.getElementById("voiceout");if(!box)return;
  const r=parseSpoken(txt);
  if(!r||(!r.km&&!r.sec)){box.textContent=txt.trim()?"Say the distance and time, like “2.4 in 12 minutes 45”.":"";box.className="t2";return}
  if(r.km)document.getElementById("rk").value=r.km;
  if(r.sec)document.getElementById("rt").value=Math.floor(r.sec/60)+":"+pad(r.sec%60);
  document.getElementById("rd").value=r.d;
  const pr=runOn(r.d);const isTest=r.tt||!!(pr&&pr.test&&r.km&&Math.abs(r.km-2.4)<=0.15);
  document.getElementById("rtt").checked=isTest;
  const missing=!r.km?"Distance missing.":!r.sec?"Time missing.":"";
  box.className="t2"+(missing?"":" ok");
  box.textContent=missing?`Got ${r.km?r.km+" km":fmt(r.sec)} on ${nice(pd(r.d))}. ${missing}`
    :`Got it: ${r.km} km in ${fmt(r.sec)} on ${nice(pd(r.d))} · ${fmt(r.sec/r.km)}/km${isTest?" · 2.4 test":""}. Tap Log Run.`;
}

  const dt=(d,h,m,add_=0)=>{const x=new Date(pd(d).getTime());x.setHours(h,m+add_,0,0);return `${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`};

        let mins=(h2*60+m2)-(h1*60+m1);if(mins<=0)mins+=1440;
        out.push(ev(`shift-${d}`,d,h1,m1,mins,"Shift @ Univers",`${isNight(d)?"Night shift":"Day shift"} ${tm.replace("-","–")} · nothing else planned`,["-P1D","-PT2H"]));nShift++}}

  }
  return {text:["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Rhythm//Planner//EN","CALSCALE:GREGORIAN","X-WR-CALNAME:Rhythm",...extra,...out,"END:VCALENDAR"].join("\r\n"),nRun,nStudy,nShift};
}

// ---------- Automatic sync to a secret GitHub Gist ----------
// The key and sync status live outside S, so backups never contain the key and a restore never overwrites them.
const TOKEN_KEY="rhythm-gh-token",SYNC_KEY="rhythm-sync";
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let SY=lsGet(SYNC_KEY,null);
const ghToken=()=>lsGet(TOKEN_KEY,null);
const syncOn=()=>!!(ghToken()&&SY&&SY.gist);
function setSY(p){SY=Object.assign({},SY||{},p);lsSet(SYNC_KEY,SY)}
async function gh(path,opt={}){
  const r=await fetch("https://api.github.com"+path,{...opt,headers:{"Authorization":"Bearer "+ghToken(),"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(opt.body?{"Content-Type":"application/json"}:{})}});
  if(!r.ok){const e=new Error("github "+r.status);e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
function icsSubscription(){
  const last=new Date(Math.max(END.getTime(),schedule().last?pd(schedule().last).getTime():0,add(TODAY,28).getTime()));
  const days=[];for(let d=add(TODAY,-7);d<=last&&days.length<200;d=add(d,1))days.push(ds(d));
  return icsText(days,["X-WR-CALDESC:Runs and Security+ study from Rhythm","REFRESH-INTERVAL;VALUE=DURATION:PT1H","X-PUBLISHED-TTL:PT1H"]).text;
}
const syncFiles=()=>({"rhythm-backup.json":{content:JSON.stringify(S)},"rhythm.ics":{content:icsSubscription()}});
const calURL=()=>SY&&SY.user&&SY.gist?`https://gist.githubusercontent.com/${SY.user}/${SY.gist}/raw/rhythm.ics`:null;
const syncErr=e=>e&&(e.status===401||e.status===403)?"Your GitHub key was rejected. It may have expired; connect a new one.":e&&e.status===404?"The sync file is missing on GitHub. Disconnect and connect again.":"Couldn't reach GitHub. It'll retry when you're back online.";
let syncT=null,syncBusy=false;
function scheduleSync(){if(!syncOn()||SY.pending)return;setSY({dirty:true});clearTimeout(syncT);syncT=setTimeout(pushSync,2500)}
// Two-way sync between devices. SY.rm = the backup's mtime the last time this device saw it.
// If the backup changed since then, another device saved: take it, or merge it with changes made here.
async function fetchRemote(){
  const g=await gh("/gists/"+SY.gist,{cache:"no-store"});const f=g.files["rhythm-backup.json"];
  if(!f)throw Object.assign(new Error("missing"),{status:404});
  return JSON.parse(f.truncated?await (await fetch(f.raw_url,{cache:"no-store"})).text():f.content);
}
// Ticked videos, finished runs and logged runs are kept from both copies; everything else comes from the newer copy.
function mergeState(a,b){
  const [nw,old]=(a.mtime||0)>=(b.mtime||0)?[a,b]:[b,a];
  const o=Object.assign({},DEF,JSON.parse(JSON.stringify(nw)));
  o.done=Object.assign({},old.done,nw.done);o.runNote=Object.assign({},old.runNote,nw.runNote);o.runDone=Object.assign({},old.runDone,nw.runDone);
  const k=r=>[r.d,r.km,r.sec].join("|"),have=new Set((o.runs||[]).map(k));
  o.runs=[...(o.runs||[]),...(old.runs||[]).filter(r=>!have.has(k(r)))].sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);
  o.mtime=Date.now();return o; // a merge is a new version, so other devices pick it up
}
const sameData=(a,b)=>{const c=o=>JSON.stringify(Object.assign({},o,{mtime:0}));return c(a)===c(b)};
function adoptState(o,msg){
  const differs=!sameData(S,o);S=Object.assign({},DEF,o);
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(!differs)return;
  cache={};applyTheme();renderIsland();const y=scrollY;render();scrollTo(0,y);if(msg)toast(msg);
}
let pullBusy=false;
async function pullSync(){
  if(!syncOn()||SY.pending||syncBusy||pullBusy||!navigator.onLine)return;pullBusy=true;
  try{
    const o=await fetchRemote(),r=o.mtime||0;
    if(r!==SY.rm){
      if(SY.dirty){adoptState(mergeState(S,o),{t:"Synced",s:"Merged with your other device",k:"copy"});setSY({rm:r});pullBusy=false;return pushSync()}
      adoptState(o,{t:"Synced",s:"Updated from your other device",k:"copy"});setSY({rm:r,dirty:false,err:null,last:Date.now()});
    }
    if(SY.dirty||SY.lastDay!==ds(new Date())){pullBusy=false;return pushSync()}
    if(SY.err)setSY({err:null});
  }catch(e){if(e.status===401||e.status===403||e.status===404)setSY({err:syncErr(e)})}
  finally{pullBusy=false}
}
async function pushSync(manual){
  if(!syncOn()||SY.pending||syncBusy)return;syncBusy=true;
  try{
    // Another device saved since we last looked: fold its changes in before overwriting.
    if(SY.rm!==undefined){try{const o=await fetchRemote(),r=o.mtime||0;if(r!==SY.rm)adoptState(mergeState(S,o),{t:"Synced",s:"Merged with your other device",k:"copy"})}catch(e){if(e.status===401||e.status===403)throw e}}
    await gh("/gists/"+SY.gist,{method:"PATCH",body:JSON.stringify({files:syncFiles()})});
    setSY({last:Date.now(),lastDay:T,dirty:false,err:null,rm:S.mtime||0});if(manual)toast({t:"Backed up",s:"Saved to GitHub · calendar updated",k:"copy"})}
  catch(e){setSY({err:syncErr(e)});if(manual)toast({t:"Backup failed",s:e.status===401||e.status===403?"GitHub key rejected":"Check your connection",k:"warn"})}
  finally{syncBusy=false;if(route()==="settings")render()}
}
// ---------- Password login ----------
// No server, so the GitHub key itself is locked with the password (PBKDF2 + AES-GCM, done on the phone)
// and the locked copy sits in a public gist. Any device can fetch it by username and unlock it with the password.
const LOGIN_DESC="Rhythm login",LOGIN_FILE="rhythm-login.json",PBKDF_IT=600000;
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function pwKey(pw,salt,it){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
let pwBusy=false;
async function setLoginPassword(pw,pw2){
  if(pwBusy||!syncOn())return;
  if(pw.length<10){toast({t:"Password too short",s:"Use at least 10 characters",k:"warn"});return}
  if(pw!==pw2){toast({t:"Passwords don't match",s:"Type the same password twice",k:"warn"});return}

// Uses Spotify's PKCE login (no secret needed). Tokens live only on this phone, outside app data and backups.
const SP_KEY="rhythm-spotify",SP_PKCE="rhythm-spotify-pkce";
const SP_REDIRECT=location.origin+location.pathname;
const SP_SCOPES="user-read-playback-state user-modify-playback-state";
let SP=lsGet(SP_KEY,null);
const spOn=()=>!!(SP&&SP.refresh&&S.spClient);
const spPlaylist=()=>{const m=(S.spPlaylist||"").match(/playlist[/:]([A-Za-z0-9]{10,})/);return m?m[1]:null};
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function spLogin(){
  const id=(S.spClient||"").trim();if(!/^[0-9a-f]{32}$/i.test(id)){toast({t:"Add your Client ID first",s:"From your Spotify developer app",k:"warn"});return}
  const ver=b64url(crypto.getRandomValues(new Uint8Array(48))),state=b64url(crypto.getRandomValues(new Uint8Array(12)));
  const chal=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(ver)));
  lsSet(SP_PKCE,{ver,state});
  location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({client_id:id,response_type:"code",redirect_uri:SP_REDIRECT,code_challenge_method:"S256",code_challenge:chal,state,scope:SP_SCOPES});
}
async function spToken(body){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:S.spClient,...body})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error_description||j.error||"token"),{status:r.status});
  SP={access:j.access_token,refresh:j.refresh_token||(SP&&SP.refresh),exp:Date.now()+(j.expires_in-60)*1000};lsSet(SP_KEY,SP);
}
async function spFinishLogin(){
  const q=new URLSearchParams(location.search);if(!q.has("code")&&!q.has("error"))return;
  const pk=lsGet(SP_PKCE,null);history.replaceState(null,"",location.pathname+"#settings-studymode");lsSet(SP_PKCE,null);
  if(q.has("error")||!pk||q.get("state")!==pk.state){toast({t:"Spotify not connected",s:q.get("error")==="access_denied"?"You cancelled the login":"Login didn't finish. Try again",k:"warn"});return}
  try{await spToken({grant_type:"authorization_code",code:q.get("code"),redirect_uri:SP_REDIRECT,code_verifier:pk.ver});
    toast({t:"Spotify connected",s:"Now pick your speaker",k:"ok"});render()}
  catch(e){toast({t:"Spotify login failed",s:"Check the Redirect URI in your Spotify app",k:"warn"})}
}
async function sp(path,opt={}){
  if(!SP||!SP.refresh)throw Object.assign(new Error("not connected"),{status:401});
  if(Date.now()>SP.exp)await spToken({grant_type:"refresh_token",refresh_token:SP.refresh});
  const go=()=>fetch("https://api.spotify.com/v1"+path,{...opt,headers:{"Authorization":"Bearer "+SP.access,...(opt.body?{"Content-Type":"application/json"}:{})}});
  let r=await go();
  if(r.status===401){await spToken({grant_type:"refresh_token",refresh_token:SP.refresh});r=await go()}
  if(!r.ok){const j=await r.json().catch(()=>({}));throw Object.assign(new Error((j.error&&j.error.message)||"spotify "+r.status),{status:r.status,reason:j.error&&j.error.reason})}
  return r.status===204||r.status===202?null:r.json().catch(()=>null);
}

async function spPlayStudy(opt={}){
  const list=(await sp("/me/player/devices")).devices||[];
  let dev=list.find(d=>S.spDevice&&d.name===S.spDevice),fallback=false;
  // Spotify often hides an idle speaker while the phone is playing. Try the speaker's last known ID anyway.
  if(!dev&&S.spDevId){try{await sp("/me/player",{method:"PUT",body:JSON.stringify({device_ids:[S.spDevId],play:false})});dev={id:S.spDevId,name:S.spDevice}}catch(e){}}
  if(dev&&!dev.is_active&&list.some(d=>d.id===dev.id)){try{await sp("/me/player",{method:"PUT",body:JSON.stringify({device_ids:[dev.id],play:false})});await new Promise(r=>setTimeout(r,700))}catch(e){}}
  // The chosen speaker has dropped off Spotify: ask instead of quietly playing on the phone.
  if(!dev&&S.spDevice&&!opt.allowPhone)throw Object.assign(new Error("asleep"),{code:"ASLEEP"});
  if(!dev){dev=list.find(d=>d.is_active)||list.find(d=>d.type==="Smartphone")||list[0];fallback=true}
  if(!dev)throw Object.assign(new Error("No speaker available. Open Spotify once, then try again"),{status:0});
  if(!fallback&&dev.id&&S.spDevId!==dev.id){S.spDevId=dev.id;save()}
  const q="?device_id="+encodeURIComponent(dev.id);
  try{await sp("/me/player/play"+q,{method:"PUT",body:JSON.stringify({context_uri:"spotify:playlist:"+spPlaylist()})})}
  catch(e){if(e.status===404&&!fallback&&!opt.allowPhone)throw Object.assign(new Error("asleep"),{code:"ASLEEP"});throw e}
  await sp("/me/player/shuffle"+q+"&state=true",{method:"PUT"});
  await sp("/me/player/next"+q,{method:"POST"}).catch(()=>{});
  return {name:dev.name,id:dev.id,fallback:fallback&&!!S.spDevice};
}

// ---------- Goodnotes notes, read from Dropbox ----------
// Goodnotes' Auto Backup saves notebooks to Dropbox as PDFs. Rhythm logs in to Dropbox (PKCE, like Spotify),
// lists those PDFs and opens them in a built-in reader. Tokens stay on this device and are never in backups.
const DBX_KEY="rhythm-dropbox",DBX_PKCE="rhythm-dropbox-pkce",NOTES_LIST="rhythm-notes-list",NOTES_POS="rhythm-notes-pos";
let DBX=lsGet(DBX_KEY,null),notesList=lsGet(NOTES_LIST,null),notesBusy=false,notesErr=null,notesAll=false;
const dbxOn=()=>!DEMO&&!!(DBX&&DBX.refresh&&S.dbxKey);
async function dbxLogin(){
  const id=(S.dbxKey||"").trim();if(!/^[a-z0-9]{8,24}$/i.test(id)){toast({t:"Add your App key first",s:"From your Dropbox app's Settings page",k:"warn"});return}
  const ver=b64url(crypto.getRandomValues(new Uint8Array(48))),state="dbx."+b64url(crypto.getRandomValues(new Uint8Array(12)));
  const chal=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(ver)));
  lsSet(DBX_PKCE,{ver,state});
  location.href="https://www.dropbox.com/oauth2/authorize?"+new URLSearchParams({client_id:id,response_type:"code",redirect_uri:SP_REDIRECT,code_challenge_method:"S256",code_challenge:chal,state,token_access_type:"offline"});
}
async function dbxToken(body){
  const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:S.dbxKey,...body})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error_description||j.error||"token"),{status:r.status});
  DBX={access:j.access_token,refresh:j.refresh_token||(DBX&&DBX.refresh),exp:Date.now()+((j.expires_in||14400)-60)*1000};lsSet(DBX_KEY,DBX);
}
async function dbxFinishLogin(q){
  const pk=lsGet(DBX_PKCE,null);history.replaceState(null,"",location.pathname+"#settings-notes");lsSet(DBX_PKCE,null);
  if(q.has("error")||!pk||q.get("state")!==pk.state){toast({t:"Dropbox not connected",s:q.get("error")==="access_denied"?"You cancelled the login":"Login didn't finish. Try again",k:"warn"});return}
  try{await dbxToken({grant_type:"authorization_code",code:q.get("code"),redirect_uri:SP_REDIRECT,code_verifier:pk.ver});
    toast({t:"Dropbox connected",s:"Loading your notebooks",k:"ok"});render();loadNotes(true)}
  catch(e){toast({t:"Dropbox login failed",s:"Check the Redirect URI and permissions in your Dropbox app",k:"warn"})}
}
async function dbx(url,opt={}){
  if(!DBX||!DBX.refresh)throw Object.assign(new Error("not connected"),{status:401});
  if(Date.now()>DBX.exp)await dbxToken({grant_type:"refresh_token",refresh_token:DBX.refresh});
  const go=()=>fetch(url,{method:"POST",...opt,headers:{"Authorization":"Bearer "+DBX.access,...(opt.headers||{})}});
  let r=await go();
  if(r.status===401){await dbxToken({grant_type:"refresh_token",refresh_token:DBX.refresh});r=await go()}
  if(!r.ok)throw Object.assign(new Error("dropbox "+r.status),{status:r.status});
  return r;
}
const dbxJSON=(path,body)=>dbx("https://api.dropboxapi.com/2/"+path,{headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json());
async function loadNotes(force){
  if(!dbxOn()||notesBusy||!navigator.onLine)return;
  if(!force&&notesList&&Date.now()-notesList.at<5*60000)return;
  notesBusy=true;rerenderNotes();
  try{
    let path=(S.dbxFolder||"").trim();if(path&&!path.startsWith("/"))path="/"+path;if(path==="/")path="";
    let r=await dbxJSON("files/list_folder",{path,recursive:true,limit:2000}),all=r.entries;
    while(r.has_more){r=await dbxJSON("files/list_folder/continue",{cursor:r.cursor});all=all.concat(r.entries)}
    const files=all.filter(e=>e[".tag"]==="file"&&/\.pdf$/i.test(e.name)).map(e=>({id:e.id,name:e.name.replace(/\.pdf$/i,""),
      folder:e.path_display.split("/").slice(1,-1).join(" › "),rev:e.rev,size:e.size,mod:e.server_modified})).sort((a,b)=>a.mod<b.mod?1:-1);
    notesList={at:Date.now(),files};lsSet(NOTES_LIST,notesList);notesErr=null;
  }catch(e){notesErr=e.status===409?"That folder isn't in your Dropbox. Check the folder in Settings › Goodnotes.":e.status===401||e.status===400?"Dropbox needs reconnecting in Settings › Goodnotes.":"Couldn't reach Dropbox. Showing the last list."}
  finally{notesBusy=false;rerenderNotes()}
}
function rerenderNotes(){if(route()==="secplus"||location.hash==="#settings-notes"){const y=scrollY;render();scrollTo(0,y)}}
const fileSize=b=>b>=1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
const NOTE_ICO='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="4.5" y="2.8" width="11.5" height="14.4" rx="2"/><path d="M4.5 6.2H3M4.5 10H3M4.5 13.8H3M8 7h5M8 10.2h5M8 13.4h3" stroke-linecap="round"/></svg>';
function notesSection(){

    ?`<button class="cell ind" data-act="dbxlogin2"><span class="ico" style="background:#FF9F0A">${NOTE_ICO}</span><span class="grow" style="text-align:left">Connect Dropbox on this device</span>${IC.chev}</button>`
    :`<a class="cell ind" href="#settings-notes"><span class="ico" style="background:#FF9F0A">${NOTE_ICO}</span><span class="grow" style="color:var(--label)">Read your Goodnotes here</span>${IC.chev}</a>`}</div></div>`;

function notesSettings(){
  return `<div class="sec"><div class="sh">Dropbox</div><div class="grp">
    <div class="cell"><label class="grow" for="set-dbxkey">App key</label><input id="set-dbxkey" type="text" value="${esc(S.dbxKey||"")}" placeholder="From your Dropbox app" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:170px"></div>
    <div class="cell"><label class="grow" for="set-dbxfolder">Folder</label><input id="set-dbxfolder" type="text" value="${esc(S.dbxFolder||"")}" placeholder="All of Dropbox" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:170px"></div>

// Downloaded notebooks are cached on the device (IndexedDB) so they open instantly and work offline.
const notesDB=()=>new Promise((res,rej)=>{const r=indexedDB.open("rhythm-notes",1);r.onupgradeneeded=()=>r.result.createObjectStore("pdf");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function cacheGet(k){try{const db=await notesDB();return await new Promise(res=>{const q=db.transaction("pdf").objectStore("pdf").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function cachePut(k,v){try{const db=await notesDB();db.transaction("pdf","readwrite").objectStore("pdf").put(v,k)}catch(e){}}
function clearNotes(){DBX=null;notesList=null;notesErr=null;[DBX_KEY,DBX_PKCE,NOTES_LIST,NOTES_POS].forEach(k=>lsSet(k,null));try{indexedDB.deleteDatabase("rhythm-notes")}catch(e){}}

// ---------- PDF reader ----------
let pdfjsP=null;
const loadPdfJs=()=>pdfjsP||(pdfjsP=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="vendor/pdfjs/pdf.min.js";
  sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc="vendor/pdfjs/pdf.worker.min.js";res(window.pdfjsLib)};sc.onerror=()=>{pdfjsP=null;rej(new Error("pdfjs"))};document.head.appendChild(sc)}));
let RD=null;
const rdEl=id=>document.getElementById(id);
async function openNote(id){
  const f=((notesList&&notesList.files)||[]).find(x=>x.id===id);if(!f)return;
  const rd=rdEl("reader");rdEl("rdTitle").textContent=f.name;rdEl("rdPage").textContent="";rdEl("rdPages").innerHTML="";rdEl("rdLoad").hidden=false;rdEl("rdMsg").textContent="Opening…";
  rd.hidden=false;document.body.classList.add("reading");requestAnimationFrame(()=>rd.classList.add("on"));
  const token={};RD={token,f,doc:null,z:1,sizes:[],cur:1};
  try{
    const [lib,c]=await Promise.all([loadPdfJs(),cacheGet(id)]);let data;
    if(c&&c.rev===f.rev)data=c.data;
    else{rdEl("rdMsg").textContent=c?"Getting the latest version…":"Downloading from Dropbox…";
      try{data=await (await dbx("https://content.dropboxapi.com/2/files/download",{headers:{"Dropbox-API-Arg":JSON.stringify({path:f.id})}})).arrayBuffer();cachePut(id,{rev:f.rev,data:data.slice(0)})}
      catch(e){if(c)data=c.data;else throw e}}
    if(!RD||RD.token!==token)return;
    const doc=await lib.getDocument({data:new Uint8Array(data)}).promise;if(!RD||RD.token!==token){doc.destroy();return}
    RD.doc=doc;

function holdHide(){const el=document.getElementById("hold");if(!el||el.hidden)return;el.classList.remove("on");el.classList.add("out");clearTimeout(holdT);holdT=setTimeout(()=>{el.hidden=true;el.classList.remove("out","done")},250)}

// Try It pad on the Gesture Control page: the same capsule and timing as the real hold, but nothing runs.
(function(){
  let t=null,on=false,pid=null;
  const cap=()=>document.querySelector("#hold-pad .pad-hold"),pad=()=>document.getElementById("hold-pad");
  function start(){const c=cap(),r=c&&c.querySelector(".hr-fg");if(!c)return;clearTimeout(t);on=true;const ms=holdMs();
    pad().classList.add("busy");c.classList.remove("out","done");r.style.transition="none";r.style.strokeDashoffset="56.55";void r.getBoundingClientRect();
    requestAnimationFrame(()=>{c.classList.add("on");r.style.transition=`stroke-dashoffset ${ms}ms linear`;r.style.strokeDashoffset="0"});
    t=setTimeout(()=>{on=false;c.classList.add("done");try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}t=setTimeout(hide,700)},ms)}
  function hide(){const c=cap();if(!c)return;c.classList.remove("on");c.classList.add("out");const p=pad();if(p)p.classList.remove("busy");
    t=setTimeout(()=>{const c2=cap();if(c2)c2.classList.remove("out","done")},250)}
  function stop(){if(!on)return;on=false;clearTimeout(t);hide()}
  document.addEventListener("touchstart",e=>{if(!e.target.closest||!e.target.closest("#hold-pad"))return;if(e.touches.length===2)start();else if(e.touches.length>2)stop()},{passive:true});
  document.addEventListener("touchend",e=>{if(on&&e.touches.length<2)stop()},{passive:true});
  document.addEventListener("touchcancel",()=>stop(),{passive:true});
  document.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.target.closest&&e.target.closest("#hold-pad")){pid=e.pointerId;start()}});
  document.addEventListener("pointerup",e=>{if(e.pointerId===pid){pid=null;stop()}});
})();
function runQuick(k){

  if(k==="run"){const r=runOn(T);if(!r||r.missed){toast({t:`No ${C.run} planned today`,k:"warn"});return}showRunSheet(T);return}

// ---------- Pull to refresh ----------
// Pull down from the top of any page: checks GitHub for a newer version of the app (reloads into it if there is one)
// and pulls the latest synced data from your other devices.
(function(){
  const el=document.getElementById("ptr"),app=document.getElementById("app"),bars=[...el.querySelectorAll("rect")];
  const TH=72,MAX=120,HOLD=56;let y0=null,pull=0,active=false,busy=false;
  const blocked=t=>!document.getElementById("sheet").hidden||!document.getElementById("reader").hidden||(t.closest&&t.closest("input,textarea,select,.sess"));
  const set=(px,anim)=>{const tr=anim?"transform .35s cubic-bezier(.2,1,.3,1)":"none";app.style.transition=tr;el.style.transition=anim?"transform .35s cubic-bezier(.2,1,.3,1),opacity .25s":"none";
    app.style.transform=px?`translateY(${px}px)`:"";el.style.transform=`translateY(${Math.max(0,px-HOLD)/2}px) rotate(${px*2.2}deg)`;el.style.opacity=px>8?Math.min(1,px/40):0};
  const fill=f=>bars.forEach((b,i)=>b.style.opacity=i<Math.round(f*12)?(1-i*.06):0);
  document.addEventListener("touchstart",e=>{if(busy||e.touches.length>1||scrollY>0||blocked(e.target)){y0=null;return}y0=e.touches[0].clientY;pull=0;active=false},{passive:true});
  document.addEventListener("touchmove",e=>{if(y0==null||busy)return;if(e.touches.length>1){if(active){active=false;set(0,true)}y0=null;return}const dy=e.touches[0].clientY-y0;
    if(dy<=0||scrollY>0){if(active){active=false;set(0,true)}return}
    active=true;e.preventDefault();pull=Math.min(MAX,dy*.5);set(pull,false);fill(Math.min(1,pull/TH))},{passive:false});
  document.addEventListener("touchend",()=>{if(y0==null)return;y0=null;if(!active)return;active=false;
    if(pull<TH){set(0,true);return}
    busy=true;set(HOLD,true);el.classList.add("spin");bars.forEach(b=>b.style.opacity="");
    const t0=Date.now();refreshNow().then(reloading=>{if(reloading)return;
      setTimeout(()=>{el.classList.remove("spin");set(0,true);busy=false},Math.max(0,700-(Date.now()-t0)))});
  },{passive:true});
})();
async function refreshNow(){
  const cur=(document.querySelector('meta[name="app-version"]')||{}).content;
  let latest=null;
  try{const r=await fetch("./index.html?v="+Date.now(),{cache:"no-store"});const m=(await r.text()).match(/name="app-version" content="([^"]+)"/);latest=m&&m[1]}catch(e){}
  if(syncOn()){try{await pullSync()}catch(e){}}
  if(dbxOn()){try{await loadNotes(true)}catch(e){}}
  if(latest&&latest!==cur){
    try{sessionStorage.setItem("rhythm-ptr",cur)}catch(e){}
    try{const reg=await navigator.serviceWorker?.getRegistration();if(reg)await reg.update()}catch(e){}
    location.reload();return true;
  }
  const n=new Date();n.setHours(0,0,0,0);if(ds(n)!==T){TODAY=n;T=ds(n)}
  cache={};const y=scrollY;render();scrollTo(0,y);renderIsland();
  return false;
}
