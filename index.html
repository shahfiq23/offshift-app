<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rhythm</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="app-version" content="2.2.0">
<meta name="apple-mobile-web-app-title" content="Rhythm">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var _t=(JSON.parse(localStorage.getItem("offshift-v1")||"{}")||{}).theme;if(_t==="light"||_t==="dark")document.documentElement.setAttribute("data-theme",_t);if((JSON.parse(localStorage.getItem("offshift-v1")||"{}")||{}).splash===false)document.documentElement.classList.add("nosplash")}catch(e){}</script>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* Layout: iOS inset-grouped lists under a large title, fixed translucent tab bar at the bottom. Colors are Apple's system palette. */
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --cell2:#E9E9EE; --fill:rgba(120,120,128,.12);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.18);
  --blue:#007AFF; --orange:#FF9500; --green:#34C759; --indigo:#5856D6; --teal:#30B0C7; --red:#FF3B30;
  --bar:rgba(249,249,249,.86);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1C1C1E; --cell2:#2C2C2E; --fill:rgba(118,118,128,.24);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --blue:#0A84FF; --orange:#FF9F0A; --green:#30D158; --indigo:#5E5CE6; --teal:#40C8E0; --red:#FF453A;
  --bar:rgba(22,22,24,.86); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --cell2:#2C2C2E; --fill:rgba(118,118,128,.24);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --blue:#0A84FF; --orange:#FF9F0A; --green:#30D158; --indigo:#5E5CE6; --teal:#40C8E0; --red:#FF453A;
  --bar:rgba(22,22,24,.86); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.29 var(--font);letter-spacing:-.022em;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px)}
a{color:var(--blue);text-decoration:none}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.page{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:22px}

/* large title */
.lt{display:grid;gap:2px;padding-top:6px}
.lt .sub{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.01em}
.lt h1{margin:0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.012em}
.lt .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

.greet{font-size:22px;font-weight:700;letter-spacing:.01em;padding-top:10px;margin-bottom:-14px;
  background:linear-gradient(90deg,var(--indigo),#FF375F 55%,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.daynav{display:flex;gap:6px;align-items:center;padding-bottom:4px}
.navb{width:34px;height:34px;border-radius:50%;background:var(--fill);color:var(--blue);font-size:24px;line-height:1;display:grid;place-items:center;padding-bottom:3px}
.cal.editing{outline:2px solid var(--blue);outline-offset:2px}
.acc+.acc{border-top:.5px solid var(--sep)}
.acch{width:100%;text-align:left;cursor:pointer}
.acch .chev{transition:transform .3s cubic-bezier(.3,.7,.2,1)}
.acc.open .acch .chev{transform:rotate(90deg)}
.accb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.3,.7,.2,1)}
.acc.open .accb{grid-template-rows:1fr}
.accin{overflow:hidden;min-height:0;background:var(--bg)}
.accin .vrow{background:var(--cell);opacity:0;transform:translateY(-6px);transition:opacity .25s ease,transform .3s ease}
.acc.open .accin .vrow{opacity:1;transform:none;transition-delay:.08s}
.vrow .num{width:24px;flex:none;text-align:right;font-size:13px;color:var(--label3);font-variant-numeric:tabular-nums;margin-right:-4px}
.accin .vrow+.vrow::before{left:88px}
@media (prefers-reduced-motion:reduce){.accb,.accin .vrow,.acch .chev{transition:none}}
.vrow.nextv,.accin .vrow.nextv{background:color-mix(in srgb,var(--blue) 14%,var(--cell))}
/* startup: a white heartbeat line draws across a black screen, then the app fades in */
#splash{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-content:center;
  padding:env(safe-area-inset-top,0px) 24px env(safe-area-inset-bottom,0px);transition:opacity .45s ease;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
.nosplash #splash{display:none}
#splash .stage{width:min(78vw,340px)}
#splash .beat{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 5px rgba(255,255,255,.35))}
#splash .beatline{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.15s cubic-bezier(.45,.05,.35,1) forwards .15s}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){#splash .beatline{animation:none;stroke-dashoffset:0}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{border-radius:7px;padding:7px 0;font-size:13px;font-weight:600;color:var(--label);transition:background .2s,box-shadow .2s}
.seg button[aria-checked="true"]{background:var(--cell);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-checked="true"]{background:#636366}}
:root[data-theme="dark"] .seg button[aria-checked="true"]{background:#636366}
.backlink{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-size:17px;margin:2px 0 2px -4px;width:fit-content}
.chev.back{transform:rotate(180deg);color:var(--blue);width:10px;height:16px}
/* grouped sections */
.sec{display:grid;gap:7px;min-width:0}
.sh{font-size:13px;color:var(--label2);text-transform:uppercase;padding:0 16px;letter-spacing:-.005em}
.sh.big{font-size:22px;font-weight:700;color:var(--label);text-transform:none;padding:0 2px;letter-spacing:.01em}
.sf{font-size:13px;line-height:1.38;color:var(--label2);padding:0 16px}
.grp{background:var(--cell);border-radius:12px;overflow:hidden;min-width:0}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;position:relative;min-width:0}
.cell+.cell::before,.cellwrap+.cellwrap::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.cell.ind+.cell.ind::before{left:52px}
.cell .grow{flex:1;min-width:0}
.cell .trail{color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell .t2{font-size:15px;color:var(--label2)}
.cell.btnrow{justify-content:center;color:var(--blue);cursor:pointer;width:100%}
.cell.btnrow.destructive{color:var(--red)}
.chev{width:8px;height:13px;flex:none;color:var(--label3)}
.ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.ico svg{width:17px;height:17px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 18px;font-weight:600;font-size:17px;cursor:pointer}
.btn.fill{background:var(--blue);color:#fff}
.btn.orange{background:var(--orange);color:#000}
.btn.tint{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.btn.small{padding:7px 14px;font-size:15px;border-radius:20px}
.btn.block{width:100%}
/* first-open login screen */
.months{display:grid;gap:22px}
.cols>.col,.cols .stack{display:grid;gap:22px;align-content:start;min-width:0}
body.gate .tabbar{display:none}
.gate-top{display:grid;justify-items:center;gap:8px;text-align:center;padding:12vh 16px 8px}
.gate-top h1{font-size:30px;margin:6px 0 0}
.gate-top .t2{font-size:15px;color:var(--label2);max-width:300px}
.gate-alt{display:grid;justify-items:center;gap:14px;font-size:15px}
.gate-alt a,.gate-alt button{color:var(--blue);background:none;border:0;font:inherit;cursor:pointer;text-decoration:none}
.gate-alt button{color:var(--label2)}

/* rings */
.rings{display:flex;gap:18px;align-items:center;padding:16px}
.rings svg{width:132px;height:132px;flex:none}
.rl{display:grid;gap:10px;min-width:0}
.rl div{display:grid;gap:0}
.rl .k{font-size:15px;font-weight:600}
.rl .v{font:600 22px/1.15 var(--round);font-variant-numeric:tabular-nums;letter-spacing:0}
.rl .v small{font-size:15px;color:var(--label2);font-weight:500}

/* up next */
.next{background:var(--cell);border-radius:16px;padding:16px;display:grid;gap:10px}
.next .tag{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.next .tag i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff}
.next .tag i svg{width:13px;height:13px}
.next h2{margin:0;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.next p{margin:0;color:var(--label2);font-size:15px;line-height:1.35}

/* round checks (Reminders style) */
.chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--label3);flex:none;margin:0;display:grid;place-items:center;cursor:pointer}
.chk:checked{background:var(--orange);border-color:var(--orange)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.vrow .grow{display:grid;gap:1px}
.vrow a{color:var(--label);overflow-wrap:anywhere}
.vrow.done a{color:var(--label2)}
.vrow .code{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}

/* switch */
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;margin:0;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}

/* inputs inside cells */
.cell input[type=number],.cell input[type=text],.cell input[type=password],.cell input[type=date],.cell input[type=time],.cell select{font:inherit;letter-spacing:inherit;color:var(--label2);background:transparent;border:0;text-align:right;min-width:0;width:120px;padding:0}
.cell select{appearance:none;-webkit-appearance:none;color:var(--blue);width:auto;cursor:pointer}
.cell input:focus{color:var(--label);outline:none}
#voice{font:17px/1.3 var(--font)!important;letter-spacing:-.022em}
#voiceout:empty{display:none}
.t2.ok{color:var(--green)}
textarea{font:13px var(--mono);color:var(--label);background:transparent;border:0;width:100%;resize:vertical;padding:0}

/* bars and stats */
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--green)}
.bar.o i{background:var(--orange)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:14px 16px 4px}
.stat{display:grid;gap:2px;min-width:0}
.stat .k{font-size:13px;color:var(--label2);font-weight:600}
.stat .v{font:700 clamp(19px,5.6vw,28px)/1.1 var(--round);font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap}
.stat .v.o{color:var(--orange)} .stat .v.g{color:var(--green)}
.stat .s{font-size:13px;color:var(--label2)}
.pad{padding:12px 16px 14px;display:grid;gap:10px}

/* calendar */
.month{display:grid;gap:8px}
.mh{font-size:22px;font-weight:700;color:var(--red);padding:0 2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--cell);border-radius:12px;padding:6px 4px 8px}
.dow{font-size:11px;font-weight:600;color:var(--label2);text-align:center;padding:4px 0 6px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;border-top:.5px solid var(--sep);cursor:pointer;min-width:0;border-radius:0;color:var(--label)}
.day.blank{cursor:default}
.day .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}
.day.past .n{color:var(--label3)}
.day.today .n{background:var(--red);color:#fff;font-weight:600}
.day .st{font-size:10px;font-weight:600;color:#fff;background:var(--indigo);border-radius:4px;padding:1px 4px;white-space:nowrap;max-width:100%;overflow:hidden;font-variant-numeric:tabular-nums}
.day.rec .st{background:transparent;color:var(--indigo)}
.day.busy .st{background:var(--fill);color:var(--label2)}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--label2);padding:0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* details (disclosure groups) */
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details .chev{transition:transform .2s}
details[open]>summary .chev{transform:rotate(90deg)}
.obj{font-size:13px;color:var(--label2);text-transform:uppercase;padding:14px 16px 4px;background:var(--bg)}

/* week plan */
.wk{display:grid;gap:4px}
.wk .h{display:flex;gap:8px;align-items:center}
.wk .h b{font-weight:600}
.badge{font-size:12px;font-weight:600;color:var(--orange);background:color-mix(in srgb,var(--orange) 16%,transparent);border-radius:6px;padding:2px 7px}
.wk dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:2px 0 0;font-size:15px}
.wk dt{color:var(--label2)}
.wk dd{margin:0}

/* chart */
svg text{fill:var(--label2);font:10px var(--font)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);display:flex;justify-content:space-around;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar a{flex:1;max-width:120px;display:grid;justify-items:center;gap:2px;color:var(--label2);font-size:10px;font-weight:500;letter-spacing:.01em;padding-bottom:4px}
.tabbar a svg{width:26px;height:26px}
.tabbar a[aria-current="page"]{color:var(--orange)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* ---------- iPad and desktop ---------- */
.side-title{display:none}
@media (min-width:768px){
  .page{max-width:1080px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));gap:24px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  .cols.sticky-l>.col:first-child,.cols.split>.col:first-child{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
  .cols.split{grid-template-columns:minmax(0,320px) minmax(0,1fr)}
  .cols.split .cell.sel{background:var(--blue)}
  .cols.split .cell.sel .grow,.cols.split .cell.sel .trail{color:#fff!important}
  .cols.split .cell.sel .chev{color:#fff;opacity:.8}
  .pageh{margin:0 0 -8px;font-size:22px;font-weight:700;letter-spacing:.01em;padding-top:2px}
  .months{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start}
  .ws-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .ws-day{background:var(--cell);border-radius:12px;padding:10px 9px 12px;display:grid;gap:7px;align-content:start;text-align:left;min-height:132px;
    transition:transform .15s}
  .ws-day:active{transform:scale(.97)}
  .ws-day.past{opacity:.6}
  .ws-day.sel{box-shadow:0 0 0 2px var(--blue) inset}
  .ws-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px}
  .ws-dow{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase}
  .ws-n{font:600 20px/1 var(--round);min-width:30px;height:30px;display:grid;place-items:center;border-radius:15px;margin:-5px -4px 0 0}
  .ws-day.today .ws-n{background:var(--red);color:#fff}
  .ws-tag{justify-self:start;font-size:11px;font-weight:600;color:#fff;background:var(--indigo);border-radius:5px;padding:2px 6px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .ws-tag.hollow{background:transparent;color:var(--indigo);box-shadow:0 0 0 1.2px var(--indigo) inset}
  .ws-tag.grey{background:var(--label3)}
  .ws-tag.free{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
  .ws-l{display:flex;align-items:center;gap:5px;font-size:12.5px;line-height:1.25;color:var(--label);min-width:0}
  .ws-l i{flex:none;width:7px;height:7px;border-radius:50%}
  .ws-l.done{color:var(--label2)}
  .ws-l.muted{color:var(--label2)}
  .tabbar a{max-width:150px}
  body.gate .page{max-width:520px}
}
/* Landscape iPad and desktop: tabs become a sidebar on the left, like iPad apps. */
@media (min-width:1100px){
  body{padding-left:248px}
  .tabbar{top:0;right:auto;width:248px;flex-direction:column;justify-content:flex-start;gap:2px;border-top:0;border-right:.5px solid var(--sep);
    padding:calc(env(safe-area-inset-top,0px) + 20px) 12px 20px max(12px,env(safe-area-inset-left,0px))}
  .tabbar .side-title{display:block;font-size:28px;font-weight:700;letter-spacing:.01em;padding:4px 10px 14px;color:var(--label)}
  .tabbar a{flex:none;max-width:none;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;font-size:17px;font-weight:500;color:var(--label)}
  .tabbar a svg{width:24px;height:24px;color:var(--orange)}
  .tabbar a[aria-current="page"]{background:var(--orange);color:#fff}
  .tabbar a[aria-current="page"] svg{color:#fff}
  .page{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.gate{padding-left:0}
  .sess,.island{left:248px}
}

/* HUD toast */
/* notifications: a capsule that drops from the top like the Dynamic Island */
/* Study Mode capsule: compact countdown that expands for controls */
.sess{position:fixed;left:0;right:0;margin:0 auto;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:110;background:#000;color:#fff;cursor:pointer;
  width:136px;height:38px;border-radius:20px;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 12px;
  box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 0 .5px rgba(255,255,255,.14) inset;overflow:hidden;
  transition:width .45s cubic-bezier(.2,1.2,.35,1),height .45s cubic-bezier(.2,1.2,.35,1),border-radius .45s,padding .3s;animation:sessin .5s cubic-bezier(.2,1.35,.35,1)}
.sess .sx-time{font:600 14px/1 var(--font);font-variant-numeric:tabular-nums;color:#30D158;letter-spacing:0}
.sess .eq{display:flex;gap:2.5px;align-items:flex-end;height:15px}
.sess .eq i{width:3px;border-radius:2px;background:#30D158;height:100%;animation:eq 1s ease-in-out infinite}
.sess .eq i:nth-child(2){animation-delay:-.35s}.sess .eq i:nth-child(3){animation-delay:-.7s}
.sess.paused .eq i{animation:none;height:35%}

// ---------- run placement ----------
// Shift days are fully off. "rec" = the day a night shift ends (home ~9am, sleeping): no run, half study.
// Each week picks up to 3 runs on the remaining free days. Intervals matter most, then tempo/test, then easy.
// Two hard sessions are never placed on back-to-back days.
function weekRuns(w){
  if(cache["w"+w])return cache["w"+w];
  const days=[...Array(7)].map((_,i)=>ds(add(START,w*7+i)));
  // When a day in this week is marked busy, its run moves to another free day from today on (past days keep only runs already done).
  const hasBusy=days.some(skipRun);
  const free=days.filter(s=>dayType(s)==="off"&&!skipRun(s)&&(!hasBusy||s>=T||S.runDone[s]));
  const testWk=isTestWk(w);
  const val={A:10,B:4,C:testWk?12:8};
  const combos=(arr,k,st=0,cur=[])=>k===0?[cur]:arr.slice(st).flatMap((_,j)=>combos(arr,k-1,st+j+1,[...cur,arr[st+j]]));
  const perms=a=>a.length<2?[a]:a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(r=>[x,...r]));
  const kindSets={1:[["A"],["C"]],2:[["A","C"],["A","B"],["C","B"]],3:[["A","B","C"]]};
  let best=null,bs=-1e9;
  for(let k=1;k<=Math.min(3,free.length);k++)for(const c of combos(free,k))for(const ks of kindSets[k])for(const pm of perms(ks)){
    let sc=pm.reduce((a,x)=>a+val[x],0);
    for(let i=1;i<c.length;i++){const g=diff(pd(c[i]),pd(c[i-1]));if(g===1&&pm[i]!=="B"&&pm[i-1]!=="B")sc-=7;if(g>=2)sc+=1}
    if(pm.indexOf("A")>-1&&pm.indexOf("C")>-1&&pm.indexOf("A")>pm.indexOf("C"))sc-=.5;
    if(sc>bs){bs=sc;best=c.map((d,i)=>[d,pm[i]])}
  }
  const out={};(best||[]).forEach(([d,k])=>out[d]=k);
  cache["w"+w]=out;return out;
}
function runOn(s){const w=Math.floor(diff(pd(s),START)/7);if(w<0||w>8)return null;const k=weekRuns(w)[s];return k?{w,k,text:planText(w,k),focus:planFocus(w),test:k==="C"&&isTestWk(w)}:null}

// ---------- 2.4 km progress charts ----------
// Test chart: logged 2.4 tests against the target path (13:00 on 2 Nov down to 11:00 on 3 Jan). Faster is higher.
function testChart(){
  const tests=S.runs.filter(r=>r.tt).sort((a,b)=>a.d<b.d?-1:1);
  const W=340,H=190,L=40,R=12,Tp=14,B=26,span=diff(END,START);
  const xs=d=>L+Math.max(0,Math.min(1,diff(pd(d),START)/span))*(W-L-R);
  const lo=Math.min(goalSec()-30,...tests.map(t=>t.sec)),hi=Math.max(BASE_SEC+30,...tests.map(t=>t.sec));
  const ys=sec=>Tp+(sec-lo)/(hi-lo)*(H-Tp-B);
  const ticks=[];for(let t=Math.ceil(lo/60)*60;t<=hi;t+=60)ticks.push(t);
  let g=ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${ys(t)}" y2="${ys(t)}" stroke="var(--sep)"/><text x="${L-6}" y="${ys(t)+3.5}" text-anchor="end">${fmt(t)}</text>`).join("");
  g+=`<line x1="${L}" x2="${W-R}" y1="${ys(goalSec())}" y2="${ys(goalSec())}" stroke="var(--green)" stroke-width="1.2"/><text x="${W-R}" y="${ys(goalSec())-5}" text-anchor="end" style="fill:var(--green);font-weight:600">Goal ${fmt(goalSec())}</text>`;
  const target=`<line x1="${xs(ds(START))}" y1="${ys(BASE_SEC)}" x2="${xs(ds(END))}" y2="${ys(goalSec())}" stroke="var(--label2)" stroke-dasharray="4 4" stroke-width="1.2"/>`;
  const months=[[2026,10,1],[2026,11,1],[2027,0,1]].map(([y,m,d])=>{const dd=new Date(y,m,d);if(dd<START)dd.setTime(START.getTime());return `<text x="${xs(ds(dd))}" y="${H-8}" text-anchor="${m===10?"start":"middle"}">${MON[m]}</text>`}).join("");
  const today=TODAY>=START&&TODAY<=END?`<line x1="${xs(T)}" x2="${xs(T)}" y1="${Tp}" y2="${H-B}" stroke="var(--blue)" stroke-opacity=".5" stroke-dasharray="2 3"/>`:"";
  const line=tests.length>1?`<polyline points="${tests.map(t=>`${xs(t.d)},${ys(t.sec)}`).join(" ")}" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:"";
  const dots=tests.map((t,i)=>`<circle cx="${xs(t.d)}" cy="${ys(t.sec)}" r="${i===tests.length-1?5:3.5}" fill="var(--orange)" stroke="var(--cell)" stroke-width="2"><title>${nice(pd(t.d))}: ${fmt(t.sec)}</title></circle>`).join("");
  const last=tests[tests.length-1];
  const lbl=last?`<text x="${Math.min(xs(last.d)+8,W-R-30)}" y="${ys(last.sec)-9}" style="fill:var(--label);font-weight:700;font-size:12px">${fmt(last.sec)}</text>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="2.4 km test times against the target path">${g}${target}${today}${months}${line}${dots}${lbl}</svg>`;
}
// Pace chart: every logged run's pace per km, oldest to newest. Faster is higher.
function paceChart(){
  const runs=[...S.runs].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).slice(-14);
  if(!runs.length)return "";
  const W=340,H=150,L=40,R=12,Tp=14,B=22;
  const paces=runs.map(r=>r.sec/r.km),goalP=goalSec()/2.4;
  const lo=Math.min(goalP-10,...paces),hi=Math.max(goalP+60,...paces)+30;
  const n=runs.length,bw=Math.min(18,(W-L-R)/n-6),xs=i=>L+((i+.5)/n)*(W-L-R),ys=p=>Tp+(p-lo)/(hi-lo)*(H-Tp-B);
  const ticks=[];for(let t=Math.ceil(lo/30)*30;t<=hi;t+=30)ticks.push(t);
  let g=ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${ys(t)}" y2="${ys(t)}" stroke="var(--sep)"/><text x="${L-6}" y="${ys(t)+3.5}" text-anchor="end">${fmt(t)}</text>`).join("");
  g+=`<line x1="${L}" x2="${W-R}" y1="${ys(goalP)}" y2="${ys(goalP)}" stroke="var(--green)" stroke-width="1.2"/><text x="${W-R}" y="${ys(goalP)-5}" text-anchor="end" style="fill:var(--green);font-weight:600">Goal pace ${fmt(goalSec()/2.4)}</text>`;
  const bars=runs.map((r,i)=>{const p=paces[i];return `<rect x="${xs(i)-bw/2}" y="${ys(p)}" width="${bw}" height="${Math.max(3,H-B-ys(p))}" rx="4" fill="${r.tt?"var(--orange)":"var(--teal)"}"><title>${nice(pd(r.d))}: ${r.km} km, ${fmt(p)}/km</title></rect>`}).join("");
  const lab=runs.map((r,i)=>(n<=7||(n-1-i)%2===0)?`<text x="${xs(i)}" y="${H-6}" text-anchor="middle">${pd(r.d).getDate()}/${pd(r.d).getMonth()+1}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Pace per km for recent runs">${g}${bars}${lab}</svg>`;
}

// ---------- Spoken run entry (iPhone keyboard dictation) ----------
// Reads things like "2.4 in 12 minutes 45", "ran 3k this morning, 18:20", "2.4 test yesterday 12:31".
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50};
function wordsToDigits(t){
  // "twenty five" -> 25, "two point four" -> 2.4, "a half" kept as is
  t=t.replace(/\b(twenty|thirty|forty|fifty)[\s-](one|two|three|four|five|six|seven|eight|nine)\b/g,(m,a,b)=>String(NUMW[a]+NUMW[b]));
  t=t.replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty)\b/g,m=>String(NUMW[m]));
  t=t.replace(/(\d+)\s*point\s*(\d+)/g,"$1.$2");
  return t;
}
function parseSpoken(raw){
  if(!raw||!raw.trim())return null;
  let t=wordsToDigits(" "+raw.toLowerCase().replace(/[,!?]/g," ")+" ");
  const out={tt:/\b(test|time trial|trial|ippt|all[- ]out)\b/.test(t)};
  // date
  let d=new Date(TODAY);
  if(/\byesterday\b|\blast night\b/.test(t))d=add(TODAY,-1);
  else{const m=t.match(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/);
    if(m){const want=LONGDOW.map(x=>x.toLowerCase()).indexOf(m[1]);let back=(TODAY.getDay()-want+7)%7;d=add(TODAY,-back)}}
  out.d=ds(d);
  // distance
  let km=null,m;
  if(m=t.match(/(\d+(?:\.\d+)?)\s*(?:km|kms|k|kilomet(?:er|re)s?|kay)\b/)){km=parseFloat(m[1]);t=t.replace(m[0]," ")}
  else if(m=t.match(/(\d{3,5})\s*(?:m|meters|metres)\b/)){km=parseInt(m[1])/1000;t=t.replace(m[0]," ")}
  else if(m=t.match(/(?:^|\s)(\d{1,2}\.\d{1,2})(?=\s)/)){const v=parseFloat(m[1]);if(v>0&&v<=21){km=v;t=t.replace(m[1]," ")}}
  // time
  let sec=null;
  if(m=t.match(/(\d{1,2}):(\d{2}):(\d{2})/))sec=+m[1]*3600+ +m[2]*60+ +m[3];
  else if(m=t.match(/(\d{1,3})[:.](\d{2})(?!\d)/))sec=+m[1]*60+ +m[2];

// Uses Spotify's PKCE login (no secret needed). Tokens live only on this phone, outside app data and backups.
const SP_KEY="rhythm-spotify",SP_PKCE="rhythm-spotify-pkce";
const SP_REDIRECT=location.origin+location.pathname;
const SP_SCOPES="user-read-playback-state user-modify-playback-state";
let SP=lsGet(SP_KEY,null);
const spOn=()=>!!(SP&&SP.refresh&&S.spClient);
const spPlaylist=()=>{const m=(S.spPlaylist||"").match(/playlist[/:]([A-Za-z0-9]{10,})/);return m?m[1]:null};
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function spLogin(){
  const id=(S.spClient||"").trim();if(!/^[0-9a-f]{32}$/i.test(id)){toast({t:"Add your Client ID first",s:"From your Spotify developer app",k:"warn"});return}
  const ver=b64url(crypto.getRandomValues(new Uint8Array(48))),state=b64url(crypto.getRandomValues(new Uint8Array(12)));
  const chal=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(ver)));
  lsSet(SP_PKCE,{ver,state});
  location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({client_id:id,response_type:"code",redirect_uri:SP_REDIRECT,code_challenge_method:"S256",code_challenge:chal,state,scope:SP_SCOPES});
}
async function spToken(body){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:S.spClient,...body})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error_description||j.error||"token"),{status:r.status});
  SP={access:j.access_token,refresh:j.refresh_token||(SP&&SP.refresh),exp:Date.now()+(j.expires_in-60)*1000};lsSet(SP_KEY,SP);
}
async function spFinishLogin(){
  const q=new URLSearchParams(location.search);if(!q.has("code")&&!q.has("error"))return;
  const pk=lsGet(SP_PKCE,null);history.replaceState(null,"",location.pathname+"#settings-studymode");lsSet(SP_PKCE,null);
  if(q.has("error")||!pk||q.get("state")!==pk.state){toast({t:"Spotify not connected",s:q.get("error")==="access_denied"?"You cancelled the login":"Login didn't finish. Try again",k:"warn"});return}
  try{await spToken({grant_type:"authorization_code",code:q.get("code"),redirect_uri:SP_REDIRECT,code_verifier:pk.ver});
    toast({t:"Spotify connected",s:"Now pick your speaker",k:"ok"});render()}
  catch(e){toast({t:"Spotify login failed",s:"Check the Redirect URI in your Spotify app",k:"warn"})}
}
async function sp(path,opt={}){
  if(!SP||!SP.refresh)throw Object.assign(new Error("not connected"),{status:401});
  if(Date.now()>SP.exp)await spToken({grant_type:"refresh_token",refresh_token:SP.refresh});
  const go=()=>fetch("https://api.spotify.com/v1"+path,{...opt,headers:{"Authorization":"Bearer "+SP.access,...(opt.body?{"Content-Type":"application/json"}:{})}});
  let r=await go();
  if(r.status===401){await spToken({grant_type:"refresh_token",refresh_token:SP.refresh});r=await go()}
  if(!r.ok){const j=await r.json().catch(()=>({}));throw Object.assign(new Error((j.error&&j.error.message)||"spotify "+r.status),{status:r.status,reason:j.error&&j.error.reason})}
  return r.status===204||r.status===202?null:r.json().catch(()=>null);
}

const smReady=()=>spOn()&&spPlaylist();
const spErr=e=>e.reason==="PREMIUM_REQUIRED"?{t:"Spotify Premium needed",k:"warn"}
  :e.status===401||e.status===400?{t:"Spotify needs reconnecting",s:"Settings › Study Mode › Connect Spotify",k:"warn"}
  :e.status===404?{t:"Speaker went to sleep",s:"Pick it in Spotify once, then try again",k:"warn"}
  :{t:"Couldn't control music",s:e.message,k:"warn"};
async function spPlayStudy(opt={}){
  const list=(await sp("/me/player/devices")).devices||[];
  let dev=list.find(d=>S.spDevice&&d.name===S.spDevice),fallback=false;
  // Spotify often hides an idle speaker while the phone is playing. Try the speaker's last known ID anyway.
  if(!dev&&S.spDevId){try{await sp("/me/player",{method:"PUT",body:JSON.stringify({device_ids:[S.spDevId],play:false})});dev={id:S.spDevId,name:S.spDevice}}catch(e){}}
  if(dev&&!dev.is_active&&list.some(d=>d.id===dev.id)){try{await sp("/me/player",{method:"PUT",body:JSON.stringify({device_ids:[dev.id],play:false})});await new Promise(r=>setTimeout(r,700))}catch(e){}}
  // The chosen speaker has dropped off Spotify: ask instead of quietly playing on the phone.
  if(!dev&&S.spDevice&&!opt.allowPhone)throw Object.assign(new Error("asleep"),{code:"ASLEEP"});
  if(!dev){dev=list.find(d=>d.is_active)||list.find(d=>d.type==="Smartphone")||list[0];fallback=true}
  if(!dev)throw Object.assign(new Error("No speaker available. Open Spotify once, then try again"),{status:0});
  if(!fallback&&dev.id&&S.spDevId!==dev.id){S.spDevId=dev.id;save()}
  const q="?device_id="+encodeURIComponent(dev.id);
  try{await sp("/me/player/play"+q,{method:"PUT",body:JSON.stringify({context_uri:"spotify:playlist:"+spPlaylist()})})}
  catch(e){if(e.status===404&&!fallback&&!opt.allowPhone)throw Object.assign(new Error("asleep"),{code:"ASLEEP"});throw e}
  await sp("/me/player/shuffle"+q+"&state=true",{method:"PUT"});
  await sp("/me/player/next"+q,{method:"POST"}).catch(()=>{});
  return {name:dev.name,id:dev.id,fallback:fallback&&!!S.spDevice};
}

async function startStudyMode(opt={}){
  if(!smReady()){location.hash="#settings-studymode";toast({t:"Set up Study Mode first",s:"Settings › Study Mode",k:"warn"});return}
  if(S.session){islandOpen(true);return}
  let music=null;
  if(spOn()&&spPlaylist()){
    toast({t:opt.retry?"Reconnecting…":"Starting Study Mode…",s:opt.retry?`Looking for ${S.spDevice}`:"Talking to Spotify",k:"video"});
    const tries=opt.retry?4:1;
    for(let i=0;i<tries;i++){
      try{music=await spPlayStudy(opt);break}
      catch(e){
        if(e.code==="ASLEEP"){if(i<tries-1){await new Promise(r=>setTimeout(r,1500));continue}dismissToast();showWakeSheet(!!opt.retry);return}
        toast(spErr(e));return}
    }
  }
  S.session={start:Date.now(),dev:music&&music.id,devName:music&&music.name,paused:false};save();renderIsland();
  toast(music&&music.fallback?{t:`Study Mode on`,s:`Shuffling on ${music.name}`,k:"video"}
    :{t:"Study Mode on",s:music?"Shuffling on "+music.name:"",k:"video"});
  render();
}
